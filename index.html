var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a landscape game. Menus are two panes (hero on the left, choices on the right); exploring and battles fill the screen.
   Single dark castle-stone theme by choice (slate greys, heraldic blue and gold). */
:root{
  color-scheme:dark;
  --night:#14171b; --wood:#252a30; --wood2:#333a43; --line:#5b6672;
  --parch:#e9edf1; --dim:#9ba6b2; --ember:#ec8a3c; --gold:#e8c45e;
  --moss:#86b56a; --blood:#d6553f; --frost:#7fb7d9;
  --display:"Grenze Gotisch",Georgia,"Times New Roman",serif;
  --ui:"Nunito","Trebuchet MS",Verdana,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--parch);font-family:var(--ui);font-size:15px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% 110%,#2c3542 0%,transparent 60%);-webkit-user-select:none;user-select:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;max-width:1180px;margin:0 auto;padding-block:8px}
#app[data-screen=explore],#app[data-screen=battle]{max-width:none}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.9;margin:0;color:var(--gold);text-shadow:0 3px 0 #3a3320}
h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:0;color:var(--gold)}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:800}
p{margin:0}
.dim{color:var(--dim)} .gold{color:var(--gold)} .small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.pg{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:12px;height:100%}
.scroll{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.panel{background:var(--wood);border:2px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 3px 0 #08090b}
button{font:inherit;color:var(--parch);background:var(--wood2);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;
  padding:7px 10px;cursor:pointer;text-align:center;min-height:44px;font-weight:800}
button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.go{background:#2c5596;border-color:#6d9be0;color:#f2f6ff}
button.ghost{background:rgba(20,23,27,.7);border-bottom-width:2px;min-height:38px;padding:5px 10px;font-weight:600;font-size:13px}
button .sub{display:block;font-weight:400;font-size:12px;color:var(--dim)}
button.go .sub{color:#c5d8f5}
button.pow{grid-column:1/-1;background:linear-gradient(#f2c35b,#e08a2a);border-color:#fff0b0;color:#3a1c08;animation:glow 1s infinite alternate}
button.pow .sub{color:#5a2c0c}
@keyframes glow{from{box-shadow:0 0 4px #f2c35b}to{box-shadow:0 0 22px #ffd870}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.locked{opacity:.5}
input[type=text]{font:inherit;color:var(--parch);background:#0c0e11;border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;min-height:44px;-webkit-user-select:text;user-select:text}
.bar{height:11px;background:#0c0e11;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);transition:width .3s;border-radius:99px}
.bar.xp i{background:var(--frost)} .bar.foe i{background:var(--blood)} .bar.raid i{background:var(--ember)}
.bar.pw i{background:linear-gradient(90deg,#e08a2a,#ffd870)} .bar.pw.full{border-color:var(--gold);box-shadow:0 0 10px #f2c35b}
.stat{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;flex-wrap:wrap;min-height:20px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:#0c0e11;color:var(--gold);white-space:nowrap}
.feat{font-size:13px;border-top:1px solid var(--line);padding-top:5px}
.feat:first-child{border-top:0;padding-top:0}
/* sprites: one frame of a sheet */
.sp{background-repeat:no-repeat;aspect-ratio:1;flex:none}
.sp.mini{width:80px;height:80px;margin:-14px -12px -6px}
.sp.idle{animation:idle15 1s steps(1) infinite} .sp.idle8{animation:idle8 1s steps(1) infinite}
@keyframes idle15{50%{background-position-x:7.142857%}} @keyframes idle8{50%{background-position-x:14.285714%}}
.scene{position:absolute;inset:0;width:100%;height:100%}
.aura{position:absolute;z-index:0;border-radius:50%;opacity:.6;pointer-events:none}
.hero-stage{position:relative;height:100%;min-height:0;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.hero-stage .sp.h{position:absolute;left:50%;bottom:-14%;transform:translateX(-50%);z-index:1}
/* world map */
.lvls{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.lv{padding:4px 2px;min-height:46px;font-size:14px} .lv.done{border-color:#8a6a1e;color:var(--gold)} .lv .sub{font-size:10px;color:var(--blood)}
/* exploring */
.ex{position:relative;height:100%;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.ex canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;display:flex;gap:8px;align-items:center;text-shadow:0 1px 3px #000,0 0 6px #000;font-weight:800}
.hud.tl{left:10px;top:8px} .hud.tc{left:50%;top:8px;transform:translateX(-50%);flex-direction:column;gap:3px;font-family:var(--display);font-size:20px;color:var(--gold);white-space:nowrap} .hud.tr{right:10px;top:8px}
#joyzone{position:absolute;inset:52px 0 0 0;z-index:2;touch-action:none}
#joy{position:fixed;z-index:4;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,23,27,.35);pointer-events:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(232,196,94,.85);box-shadow:0 2px 8px #000}
#exover{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(10,12,15,.6)}
.encflash{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#fff;animation:enc .75s ease-in forwards;pointer-events:none}
.encflash b{font-family:var(--display);font-size:160px;color:var(--blood);text-shadow:0 6px 0 #000}
@keyframes enc{0%{opacity:0}12%{opacity:.9}30%{opacity:.15}48%{opacity:.9}70%{opacity:.35}100%{opacity:1;background:#14171b}}
/* battle */
.bt{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,34%);gap:10px;height:100%}
.stage{position:relative;height:100%;min-height:0;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.side{display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto;justify-content:flex-end}
.stage .tag{position:absolute;top:8px;width:40%;display:flex;flex-direction:column;gap:4px;z-index:2;text-shadow:0 1px 3px #000,0 0 6px #000;font-weight:800}
.stage .tag.l{left:8px} .stage .tag.r{right:8px}
.bsp{position:absolute;z-index:1;transform:translateX(calc(-50% + var(--dx,0px)));transition:transform .19s ease-out}
.hitfx{animation:hitfx .3s}
@keyframes hitfx{0%{filter:brightness(1.9)}25%{translate:-3% 0}50%{translate:3% 0;filter:brightness(1.3)}75%{translate:-2% 0}100%{translate:0 0}}
.proj{position:absolute;z-index:3;transition:transform .23s linear;pointer-events:none}
.proj.orb{width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,var(--c) 60%);box-shadow:0 0 22px 8px var(--c),-18px 0 16px 2px var(--c)}
.proj.orb.flip{box-shadow:0 0 22px 8px var(--c),18px 0 16px 2px var(--c)}
.proj.bolt{width:64px;height:6px;margin:-3px 0 0 -52px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c) 55%,#fff);filter:drop-shadow(0 0 6px var(--c))}

 {n:'Whispering Woods',theme:'woods',mobs:[['Green Slime','slime_green'],['Forest Bat','bat_forest'],['Bone Scout','sk_minion']],mini:['Bandit Bones','sk_rogue'],boss:['King Glop','slime_king'],relic:"King Glop's Jewel",rd:'+20% gold from battles'},

 {n:'Mistmarsh',theme:'marsh',mobs:[['Bog Slime','slime_bog'],['Will-o-Wisp','ghost_wisp'],['Marsh Stalker','sk_rogue']],mini:['The Bog Wraith','ghost_ash'],boss:['The Drowned Queen','ghost_queen'],relic:"Queen's Pearl",rd:'Heal 15% after every victory'},

const lvAtk=n=>(40+12*expLv(n)+ARMOR_HP[expTier(n)])/9+ARMOR_DEF[expTier(n)];
const lvXp=n=>Math.round(need(expLv(n))/5.5), lvGold=n=>Math.round(6*Math.pow(1.09,n)*(1+n/10));

function makeFoe(n,kind){ const W=WORLDS[Math.floor(n/10)], m=kind==='boss'?W.boss:kind==='mini'?W.mini:W.mobs[Math.floor(Math.random()*W.mobs.length)];
  const hm=kind==='boss'?3.2:kind==='mini'?2.4:rnd(.9,1.15), am=kind==='boss'?1.45:kind==='mini'?1.3:1, hp=Math.round(lvHp(n)*hm);
  return {n:m[0],id:m[1],hp,max:hp,atk:lvAtk(n)*am,kind,big:kind!=='mob',xp:lvXp(n)*(kind==='boss'?5:kind==='mini'?3:1),gold:lvGold(n)*(kind==='boss'?7:kind==='mini'?4:1),scene:Math.floor(n/10)}; }

let AC=null, muted=!!lsGet('hg_mute');
function beep(f,d,type,vol){ if(muted)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain();

  shot:()=>beep(900,.08,'triangle',.05),swing:()=>beep(300,.06,'sawtooth',.03),chest:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.07),i*80)),
  alarm:()=>[220,330,220,330].forEach((f,i)=>setTimeout(()=>beep(f,.09,'square',.05),i*90)),
  power:()=>[262,392,523,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.06),i*70)),
  win:()=>[392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square'),i*110)),lose:()=>[330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.08),i*160)),tap:()=>beep(440,.04,'triangle',.04)};

/* ---------- state ---------- */
let db=null, loaded=false, offline=false;

let me=lsGet('hg_me'), H=me?fixHero(lsGet('hg_hero_'+me)):null;
let S={screen:'who'}, B=null;   // B = the battle in progress (null when none)
const busy=()=>!!B||S.screen==='explore';   // don't swap the hero or pop messages mid-adventure

function fixHero(h){ if(!h||!CLASSES[h.cls])return null;   // older saves: fill in new fields
  if(h.cleared==null)h.cleared=Array.isArray(h.prog)?Math.min(LEVELS-1,h.prog.reduce((a,b)=>a+b,0)):0;
  h.relics=(h.relics||[]).filter(r=>r<WORLDS.length); h.weapon=Math.min(GEAR_MAX,h.weapon||0); h.armor=Math.min(GEAR_MAX,h.armor||0);
  h.wxp=h.wxp||0; h.axp=h.axp||0; h.pow=h.pow||0; h.feats=h.feats||[]; h.kills=h.kills||0; return h; }
function stats(h){const c=CLASSES[h.cls], r=h.relics||[];
  let hp=(40+12*h.lvl+ARMOR_HP[h.armor])*c.hp; if(r.includes(3))hp*=1.15;
  let atk=(6+2.2*h.lvl+WEAPON_ATK[h.weapon])*c.atk; if(r.includes(1))atk*=1.1; if(r.includes(4))atk*=1.15;

function newHero(name,cls){const h={name,cls,lvl:1,xp:0,hp:0,pow:0,gold:20,potions:2,weapon:0,armor:0,wxp:0,axp:0,cleared:0,relics:[],kills:0,raidNo:world.no,raidDmg:0,raidDay:'',raidTries:0,scales:0,feats:[],rev:0};

/* Gear levels 1-9 (stored 0-8). It earns gear XP from every victory; gold in the shop pays off whatever is left. */
const gearNeed=nx=>Math.round(GEAR_PRICE[nx]*.9);
const gxKey=k=>k==='weapon'?'wxp':'axp';
const gearCost=k=>{const nx=H[k]+1; return Math.max(1,Math.ceil(GEAR_PRICE[nx]*(1-Math.min(1,(H[gxKey(k)]||0)/gearNeed(nx)))))};

function addGearXp(x){ const ups=[]; for(const k of ['weapon','armor']){ const xk=gxKey(k); H[xk]=(H[xk]||0)+x;
    while(H[k]<GEAR_MAX){ const nx=H[k]+1; if(H[xk]<gearNeed(nx))break; if(H.lvl<GEAR_LVL[nx]){H[xk]=gearNeed(nx);break} H[xk]-=gearNeed(nx); gearUp(k); ups.push({k,look:look(nx)!==look(nx-1)}); }
    if(H[k]>=GEAR_MAX)H[xk]=0; } return ups; }

  if(ups){H.hp=stats(H).hp; if(H.lvl%5===0)feat('reached level '+H.lvl)} return ups; }

async function pump(){ if(saving||!db)return; saving=true;
  while(dirty&&db){ dirty=false; const slot=me, body=clone(H), d=db;
    try{await d.doc('heroes/'+slot).set(body)}catch(e){ await sleep(1500); try{await d.doc('heroes/'+slot).set(body)}catch(e2){ if(!busy())toast('Could not reach the guild hall. Progress is saved on this device.'); } } }
  saving=false; }
function setWorld(no){ world={no}; lsSet('hg_world',world); if(db&&loaded) db.doc('world/raid').set({no,t:Date.now()}).catch(()=>{}); }

function softRender(){ if(busy())return; const a=document.activeElement; if(a&&a.tagName==='INPUT')return; if(['who','camp','guild'].includes(S.screen))render(); }

  if(world.no>(H.raidNo||1)){ const did=(H.raidDmg||0)>0, prev=world.no-1;
    if(did){ const g=60*prev+30*H.lvl, xp=Math.round(need(H.lvl)*.5); H.gold+=g; H.scales=(H.scales||0)+1; addXp(xp); feat('helped bring down Ashmaw');

  for(const g of giftDocs){ if(g.to!==me||seenGifts.has(g.id))continue; seenGifts.add(g.id); got=true;
    if(g.kind==='potion'){H.potions++; toast(g.from+' sent you a potion!')} else {H.gold+=25; toast(g.from+' sent you 25 gold!')}

  if(got){sfx.heal();save();softRender()} }
/* Home-screen (GitHub Pages) build: window.HG_CLOUD is the save server. This shim gives it the same shape as the claude.ai db. */
const canonPw=v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
async function sha256hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function cloudDb(url,key){

  const pr=document.getElementById('exprog'); if(pr)pr.style.width=Math.round(100*E.x/W)+'%';

  c.fillStyle=T.far; c.beginPath(); c.moveTo(0,TOP); const R=seeded(L.n+5), off=cam*.25; for(let i=0;i<80;i++){ const x=i*150-off, h=60+R()*110; if(x>-200&&x<vw+200){c.lineTo(x,TOP-h); c.lineTo(x+75,TOP-h*.55);} } c.lineTo(vw,TOP); c.closePath(); c.fill();
  c.translate(-cam,TOP);
  c.fillStyle=T.ground; c.fillRect(cam-10,-4,vw+20,ROWS*CELL+10);
  const c0=Math.max(0,Math.floor(cam/CELL)-1), c1=Math.min(L.C-1,Math.ceil((cam+vw)/CELL)+1);
  for(let r=0;r<ROWS;r++)for(let col=c0;col<=c1;col++){ const x=col*CELL, y=r*CELL; const h=(col*31+r*17)%7;
    if(L.g[r][col]){ c.fillStyle=T.path; c.fillRect(x-1,y-1,CELL+2,CELL+2); c.fillStyle=T.edge;
      if(r===0||!L.g[r-1][col])c.fillRect(x,y,CELL,12); if(r===ROWS-1||!L.g[r+1][col])c.fillRect(x,y+CELL-8,CELL,8);
      if(col===0||!L.g[r][col-1])c.fillRect(x,y,8,CELL); if(col===L.C-1||!L.g[r][col+1])c.fillRect(x+CELL-8,y,8,CELL);
      c.globalAlpha=.35; circ(c,T.edge,x+30+h*14,y+40+h*9,7,4); circ(c,T.edge,x+110-h*8,y+115-h*6,5,3); c.globalAlpha=1; }

    items.push({y:L.boss.y,d:()=>{ const im=loadImg(mobSheet(id)); if(!im.naturalWidth)return; circ(c,'rgba(0,0,0,.3)',L.boss.x,L.boss.y,s*.2,s*.05); const fs=im.naturalHeight, f=Math.floor(E.t*2)%2;
      c.shadowColor='#ff5040'; c.shadowBlur=18; c.drawImage(im,f*fs,0,fs,fs,L.boss.x-s/2,L.boss.y-s*u.foot,s,s); c.shadowBlur=0; }}); }
  items.push({y:E.y,d:()=>{ const im=loadImg(heroSheet(H)), s=4.4*UNIT*(1+rank(H)*.03); circ(c,'rgba(0,0,0,.3)',E.x,E.y,46,13);
      if(rank(H)){ c.globalAlpha=.5; circ(c,RANK_COL[rank(H)],E.x,E.y,62,18); c.globalAlpha=1; }
      if(!im.naturalWidth)return; const fs=im.naturalHeight, f=E.moving?HF.walk+Math.floor(E.t*11)%6:Math.floor(E.t*2)%2;

      c.drawImage(im,f*fs,0,fs,fs,-s/2,-s*.776,s,s); c.restore(); }});
  items.sort((a,b)=>a.y-b.y); for(const it of items)it.d();

function drawChest(c,ch){ const x=ch.x, y=ch.y; circ(c,'rgba(0,0,0,.25)',x,y+4,48,12);
  poly(c,'#6a4424',[x-38,y,x+38,y,x+38,y-40,x-38,y-40]); poly(c,'#8a5a30',[x-38,y-40,x+38,y-40,x+38,y-30,x-38,y-30]);
  if(ch.open){ poly(c,'#4a2e16',[x-38,y-40,x+38,y-40,x+30,y-78,x-30,y-78]); poly(c,'#1a1210',[x-32,y-40,x+32,y-40,x+32,y-34,x-32,y-34]); }
  else { poly(c,'#8a5a30',[x-40,y-40,x+40,y-40,x+34,y-66,x-34,y-66]); c.shadowColor='#f2c35b'; c.shadowBlur=14; poly(c,'#f2c35b',[x-6,y-46,x+6,y-46,x+6,y-28,x-6,y-28]); c.shadowBlur=0; }
  poly(c,'#e8c45e',[x-40,y-22,x+40,y-22,x+40,y-16,x-40,y-16]); }
function drawGate(c,g,open,t){ const x=g.x, y=g.y+40; circ(c,'rgba(0,0,0,.25)',x,y,90,18);
  c.shadowColor=open?'#7fe0ff':'#ff5040'; c.shadowBlur=30; c.fillStyle=open?`rgba(140,230,255,${.55+.25*Math.sin(t*4)})`:'rgba(120,30,30,.55)';
  c.beginPath(); c.moveTo(x-50,y); c.lineTo(x-50,y-120); c.arc(x,y-120,50,Math.PI,0); c.lineTo(x+50,y); c.closePath(); c.fill(); c.shadowBlur=0;
  poly(c,'#6b7480',[x-74,y,x-46,y,x-46,y-150,x-74,y-150]); poly(c,'#8a94a2',[x-74,y,x-62,y,x-62,y-150,x-74,y-150]);
  poly(c,'#6b7480',[x+46,y,x+74,y,x+74,y-150,x+46,y-150]); poly(c,'#8a94a2',[x+46,y,x+58,y,x+58,y-150,x+46,y-150]);
  c.strokeStyle='#6b7480'; c.lineWidth=26; c.beginPath(); c.arc(x,y-140,60,Math.PI,0); c.stroke();
  if(!open){ c.strokeStyle='#2a2f36'; c.lineWidth=6; for(let i=-30;i<=30;i+=20){ c.beginPath(); c.moveTo(x+i,y); c.lineTo(x+i,y-150); c.stroke(); } } }
</script>
<script>
"use strict";
/* Hearthguard battle screen: turn-based. You pick a move, your hero plays its attack animation, then the enemy takes its turn.

const BU=17.5;   // % of stage height per Blender unit of a sprite

function battle(foe,opt){ opt=opt||{};
  return new Promise(resolve=>{
    B=Object.assign({e:Object.assign({stun:0,weak:0,poison:0,pdmg:0,charge:false},foe),cd:[0,0,0],guard:0,bless:0,eagle:0,et:0,busy:false,anim:false,

    loadImg(heroSheet(H)); loadImg(mobSheet(foe.id)); S.screen='battle'; render(); });
}
function vBattle(){ const e=B.e, big=e.big||B.raid, rig=e.id.startsWith('sk_'), fs=(rig?4.4:5)*BU*(big?1.35:1), hs=4.4*BU*(1+rank(H)*.03), foot=rig?.776:.743;

    <div class="tag l"><div class="stat"><span>${esc(H.name)} · Lv ${H.lvl}</span><span id="bhpT"></span></div><div class="bar"><i id="bhp"></i></div><div class="bar pw" id="bpwb"><i id="bpw"></i></div></div>
    <div class="tag r"><div class="stat"><span>${esc(e.n)}</span><span id="bfT"></span></div><div class="bar ${B.raid?'raid':'foe'}"><i id="bfhp"></i></div></div>
    ${aura(H,'left:14%;width:20%;top:80%;height:12%')}
    ${heroSpr(H,'bsp',`height:${hs}%;top:${86-.776*hs}%;left:24%;`,null,null,'id="bh"')}
    ${mobSpr(e.id,'bsp',`height:${fs}%;top:${87-foot*fs}%;left:${big?72:76}%;`,'id="bf"')}
  </div><div class="side" id="bside"></div></div>`; }
let bIdle=0;
function mountBattle(){ clearInterval(bIdle); let t=0;
  bIdle=setInterval(()=>{ if(!B||S.screen!=='battle'){clearInterval(bIdle);return} if(B.anim||B.result)return; t^=1; bFrame($b('bh'),t,HN); if(B.e.hp>0)bFrame($b('bf'),t,MN); },480);

function bFrame(el,f,n){ if(el)el.style.backgroundPositionX=fpos(f,n); }
function battleUI(){ if(!B)return; const e=B.e, st=stats(H), c=CLASSES[H.cls], res=B.result, pw=H.pow||0, set=(id,v)=>{const x=$b(id); if(x)x.style.width=Math.max(0,Math.min(100,v))+'%'};
  set('bhp',100*H.hp/st.hp); set('bpw',pw); set('bfhp',100*e.hp/e.max); const pb=$b('bpwb'); if(pb)pb.classList.toggle('full',pw>=100);
  if($b('bhpT'))$b('bhpT').textContent=H.hp+' / '+st.hp; if($b('bfT'))$b('bfT').textContent=e.hp+' / '+e.max;
  const chips=[]; if(B.guard>0)chips.push('Guard '+B.guard); if(B.bless>0)chips.push('War Cry '+B.bless); if(B.eagle>0)chips.push('Eagle Eye '+B.eagle);
  if(e.stun>0)chips.push('Enemy stunned'); if(e.weak>0)chips.push('Enemy weakened '+e.weak); if(e.poison>0)chips.push('Enemy poisoned '+e.poison); if(e.charge)chips.push('Mighty blow coming!'); if(B.raid&&!res)chips.push(B.turns+' turns left');
  let h;
  if(res){ let t;
    if(res.raid)t=`<h2>${res.win?'Ashmaw falls!':res.flew?'Time is up':'Knocked back'}</h2><p>You dealt <b class="gold">${res.dealt}</b> damage for the family.</p>`;
    else if(res.win)t=`<h2>Victory!</h2><p>+${res.gold} gold · +${res.xp} XP</p>${res.ups?`<p class="gold">Level up! You are now level ${H.lvl}.</p>`:''}${res.rank?`<p class="gold">New rank: ${RANKS[res.rank]}! Your hero looks stronger.</p>`:''}${(res.gear||[]).map(g=>`<p class="gold">Your ${g.k} grew to level ${H[g.k]+1}: ${esc(gearName(H,g.k,H[g.k]))}.${g.look?' New look!':''}</p>`).join('')}`;
    else t=`<h2>Knocked out</h2><p class="dim">Your friends carry you back to the fire. Rest, gear up, and try again.</p>`;
    h=`<div class="panel col" style="text-align:center">${t}</div><button class="go" data-act="bdone">Continue</button>`;
  } else {
    const off=B.busy?'disabled':'';
    h=`<div class="log">${B.log.map(l=>`<p>${esc(l)}</p>`).join('')}</div><div class="chips">${chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="acts">
      ${pw>=100?`<button class="pow" data-act="act" data-k="pow" ${off}>${c.power.n}!<span class="sub">${c.power.d}</span></button>`:''}
      <button class="go wide" data-act="act" data-k="atk" ${off}>Attack</button>
      ${c.skills.map((s,i)=>`<button data-act="act" data-k="${i}" ${B.busy||B.cd[i]>0||H.lvl<s.lv?'disabled':''}>${s.n}<span class="sub">${H.lvl<s.lv?'Level '+s.lv:B.cd[i]>0?'Ready in '+B.cd[i]:s.d}</span></button>`).join('')}
      <button data-act="act" data-k="potion" ${B.busy||H.potions<1?'disabled':''}>Potion<span class="sub">${H.potions} left</span></button></div>`;
  }
  const side=$b('bside'); if(side)side.innerHTML=h; }
function blog(t){B.log.push(t); if(B.log.length>3)B.log.shift()}
function bpop(id,text,cls){ const st=$b('bstage'), el=$b(id); if(!st||!el)return; const a=el.getBoundingClientRect(), s=st.getBoundingClientRect();
  const d=document.createElement('div'); d.className='pop '+(cls||''); d.textContent=text; d.style.left=(a.left-s.left+a.width/2-20)+'px'; d.style.top=(a.top-s.top+a.height*.3)+'px'; st.appendChild(d); setTimeout(()=>d.remove(),900); }
function bShake(id,frame,n){ const el=$b(id); if(!el)return; bFrame(el,frame,n); el.classList.remove('hitfx'); void el.offsetWidth; el.classList.add('hitfx'); setTimeout(()=>{ if(el.isConnected&&B&&!B.anim)bFrame(el,0,n) },300); }
const centerX=el=>{const r=el.getBoundingClientRect(); return r.left+r.width/2};
/* weapon effects: a slash arc for blades and claws, a burst where anything lands */
function slashFx(id,col,flip){ const st=$b('bstage'), el=$b(id); if(!st||!el)return; const a=el.getBoundingClientRect(), s=st.getBoundingClientRect(), d=document.createElement('div');
  d.className='slash'+(flip?' flip':''); d.style.left=(a.left-s.left+a.width/2)+'px'; d.style.top=(a.top-s.top+a.height*.52)+'px'; d.style.setProperty('--c',col); d.style.setProperty('--sz',Math.round(a.height*.42)+'px'); st.appendChild(d); setTimeout(()=>d.remove(),380); }
function burstFx(id,col){ const st=$b('bstage'), el=$b(id); if(!st||!el)return; const a=el.getBoundingClientRect(), s=st.getBoundingClientRect(), d=document.createElement('div');
  d.className='burst'; d.style.left=(a.left-s.left+a.width/2)+'px'; d.style.top=(a.top-s.top+a.height*.52)+'px'; d.style.setProperty('--c',col); st.appendChild(d); setTimeout(()=>d.remove(),420); }
async function projectile(fromId,toId,col,kind){ const st=$b('bstage'), a=$b(fromId), b=$b(toId); if(!st||!a||!b)return; const s=st.getBoundingClientRect(), ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
  const p=document.createElement('div'); p.className='proj '+(kind||'orb'); p.style.setProperty('--c',col); if(centerX(b)<centerX(a))p.classList.add('flip'); p.style.left=(centerX(a)-s.left)+'px'; p.style.top=(ra.top-s.top+ra.height*.5)+'px'; st.appendChild(p);
  void p.offsetWidth; p.style.transform=`translate(${centerX(b)-centerX(a)}px,${(rb.top+rb.height*.55)-(ra.top+ra.height*.5)}px)`; await sleep(230); p.remove(); }
/* plays 5 attack frames; melee attackers run up to the target first. onHit fires on the impact frame. */
async function attackAnim(who,ranged,col,onHit,kind){ const hero=who==='h', el=$b(hero?'bh':'bf'), tgt=$b(hero?'bf':'bh'), base=hero?HF.atk:MF.atk, n=hero?HN:MN; if(!el||!tgt){onHit();return}
  B.anim=true;
  if(!ranged){ const d=centerX(tgt)-centerX(el); el.style.setProperty('--dx',(d-Math.sign(d)*el.offsetWidth*.36)+'px'); await sleep(190); }
  for(let k=0;k<5;k++){ bFrame(el,base+k,n); if(k===1)sfx.swing(); if(k===2){ if(ranged){sfx.shot(); await projectile(hero?'bh':'bf',hero?'bf':'bh',col||'#fff',kind)} else slashFx(hero?'bf':'bh',col||'#fff',!hero); burstFx(hero?'bf':'bh',col||'#fff'); onHit(); } await sleep(85); }
  el.style.setProperty('--dx','0px'); bFrame(el,0,n); await sleep(ranged?90:200); B.anim=false; }
function strike(mult,forceCrit){ const st=stats(H); let d=st.atk*mult*rnd(.88,1.12); if(B.bless>0)d*=1.4;
  let crit=forceCrit||Math.random()<st.crit; if(!forceCrit&&B.eagle>0){crit=true;B.eagle--} if(crit)d*=1.8;
  d=Math.max(1,Math.round(d)); B.e.hp=Math.max(0,B.e.hp-d); if(B.raid)B.dealt+=d; return {d,crit}; }
async function heroAct(kind){ if(!B||B.busy||B.result)return; const st=stats(H), e=B.e, c=CLASSES[H.cls];
  if(kind==='potion'){ if(H.potions<1)return toast('No potions left.'); if(H.hp>=st.hp)return toast('You are already at full health.'); }
  const sk=kind==='potion'?null:kind==='atk'?{n:'Attack',mult:1}:kind==='pow'?c.power:c.skills[kind], power=kind==='pow';
  if(power&&(H.pow||0)<100)return; if(typeof kind==='number'&&(B.cd[kind]>0||H.lvl<sk.lv))return;
  B.busy=true; for(let i=0;i<3;i++)if(B.cd[i]>0)B.cd[i]--; if(typeof kind==='number')B.cd[kind]=sk.cd; if(power)H.pow=0;
  battleUI();
  if(kind==='potion'){ H.potions--; const h=Math.round(st.hp*.4); H.hp=Math.min(st.hp,H.hp+h); blog('You drink a potion and heal '+h+'.'); bFrame($b('bh'),HF.cheer,HN); B.anim=true; bpop('bh','+'+h,'heal'); sfx.heal(); battleUI(); await sleep(550); B.anim=false; }
  else {
    if(power){ sfx.power(); const stg=$b('bstage'); if(stg){ const f=document.createElement('div'); f.className='flash'; stg.appendChild(f); const t=document.createElement('div'); t.className='shout'; t.textContent=c.power.n+'!'; stg.appendChild(t); setTimeout(()=>{f.remove();t.remove()},1000); } bFrame($b('bh'),HF.cheer,HN); B.anim=true; await sleep(450); B.anim=false; }
    let line=kind==='atk'?'You attack':'You use '+sk.n;
    if(sk.mult){ let total=0, anyCrit=false;
      const rg=!!c.ranged[look(H.weapon)]; await attackAnim('h',rg,rg?(sk.shot||c.shot):(sk.shot||WGLOW[H.weapon]||'#ffffff'),()=>{ for(let i=0;i<(sk.hits||1);i++){const s=strike(sk.mult,sk.allcrit); total+=s.d; anyCrit=anyCrit||s.crit}
        bpop('bf','-'+total,anyCrit||power?'crit':''); bShake('bf',MF.hit,MN); anyCrit||power?sfx.crit():sfx.hit(); battleUI(); },H.cls==='ranger'?'bolt':'orb');
      line+=' for '+total+(anyCrit?', a critical hit!':'.'); if(!power)H.pow=Math.min(100,(H.pow||0)+22);
    } else { line+='.'; bFrame($b('bh'),HF.cheer,HN); B.anim=true; await sleep(300); B.anim=false; }
    if(sk.heal){ const h=Math.round(st.hp*sk.heal); H.hp=Math.min(st.hp,H.hp+h); bpop('bh','+'+h,'heal'); sfx.heal(); }
    if(sk.stun&&!B.raid)e.stun=sk.stun; if(sk.weak)e.weak=sk.weak; if(sk.poison){e.poison=sk.poison;e.pdmg=Math.max(1,Math.round(st.atk*.45))}

    blog(line); }
  battleUI(); await sleep(250); if(!B)return; if(e.hp<=0)return finishBattle(true);
  await enemyTurn(); if(!B||B.result)return; B.busy=false; battleUI(); }
async function enemyTurn(){ const e=B.e, st=stats(H);
  if(e.poison>0){ e.hp=Math.max(0,e.hp-e.pdmg); if(B.raid)B.dealt+=e.pdmg; e.poison--; blog('Poison burns '+e.n+' for '+e.pdmg+'.'); bpop('bf','-'+e.pdmg); bShake('bf',MF.hit,MN); battleUI(); await sleep(500); if(!B)return; if(e.hp<=0)return finishBattle(true); }
  if(e.stun>0){ e.stun--; blog(e.n+' is stunned and cannot move!'); battleUI(); await sleep(600); }
  else { let d=e.atk*rnd(.85,1.15); if(e.weak>0){d*=.7;e.weak--} const heavy=e.charge; if(heavy){d*=1.8;e.charge=false}
    d=Math.max(1,Math.round(d-st.def)); if(B.guard>0)d=Math.ceil(d/2);
    const caster=e.id.startsWith('sk_mage')||e.id.startsWith('ghost');
    await attackAnim('f',caster,caster?(e.id.includes('lich')?'#b070ff':e.id.includes('flame')?'#ff8a3c':'#9fe8ff'):'#ff6a5a',()=>{ H.hp=Math.max(0,H.hp-d); H.pow=Math.min(100,(H.pow||0)+14);
      bpop('bh','-'+d,heavy?'crit':''); bShake('bh',HF.hit,HN); sfx.hurt(); blog(e.n+(heavy?' unleashes a mighty blow for ':' hits you for ')+d+'.'); battleUI(); });
    if(!B)return; B.et++; if(e.big&&B.et%3===2&&H.hp>0){e.charge=true; blog(e.n+' is gathering power…')} }
  if(B.guard>0)B.guard--; if(B.bless>0)B.bless--;
  if(H.hp<=0)return finishBattle(false);
  if(B.raid){B.turns--; if(B.turns<=0)return finishBattle(false,true)} }
function finishBattle(win,flew){ const st=stats(H), e=B.e; B.anim=true;
  const hb=$b('bh'), fb=$b('bf');
  if(win){ if(fb){fb.style.transition='opacity .6s, transform .6s'; fb.style.opacity='0'; fb.style.setProperty('--dx','40px')} bFrame(hb,HF.cheer,HN); } else if(!B.raid&&hb){ hb.style.transition='opacity .5s'; hb.style.opacity='.4'; bFrame(hb,HF.hit,HN); }
  if(B.raid){ const dealt=B.dealt; if(H.raidDay!==today()){H.raidDay=today();H.raidTries=0} H.raidTries++; if((H.raidNo||1)!==world.no){H.raidNo=world.no;H.raidDmg=0}
    H.raidDmg=(H.raidDmg||0)+dealt; H.hp=st.hp; if(dealt>0)feat('struck Ashmaw for '+dealt); save();
    B.result={raid:true,dealt,win,flew}; win?sfx.win():sfx.hit(); battleUI(); return; }
  const res={win};
  if(win){ const g=Math.round(e.gold*rnd(.85,1.15)*((H.relics||[]).includes(0)?1.2:1)); H.gold+=g; H.kills=(H.kills||0)+1; res.gold=g; res.xp=e.xp;
    const r0=rank(H); res.ups=addXp(e.xp); if(rank(H)>r0)res.rank=rank(H); res.gear=addGearXp(Math.round(e.gold));
    if(H.relics.includes(2)&&!res.ups)H.hp=Math.min(stats(H).hp,H.hp+Math.round(stats(H).hp*.15));
    if(res.gear.some(x=>x.look)||res.ups)loadImg(heroSheet(H));
    sfx.win(); }
  else { H.hp=st.hp; sfx.lose(); }
  save(); B.result=res; battleUI(); }
function battleDone(){ if(!B||!B.result)return; const r=B.result, done=B.resolve; clearInterval(bIdle); B=null; done(r); }
</script>

function vGuild(){ const all=SLOTS.map(s=>({s,h:s.id===me?H:heroes[s.id]})).filter(x=>x.h).sort((a,b)=>b.h.lvl-a.h.lvl||b.h.xp-a.h.xp);

  if(a==='bdone'){ battleDone(); }
  else if(a==='go'){ if(S.screen==='create'){const i=document.getElementById('heroname'); if(i)S.name=i.value} S.screen=d.to; if(d.to==='camp'||d.to==='guild'){checkRaid();processGifts()} render(); }
  else if(a==='pick'){ me=d.id; lsSet('hg_me',me); const loc=fixHero(lsGet('hg_hero_'+me)), rem=heroes[me]; H=rem&&(!loc||(rem.rev||0)>=(loc.rev||0))?fixHero(clone(rem)):loc;
    if(H){ if(!rem||(rem.rev||0)<(H.rev||0)){dirty=true;pump()} S.screen='camp'; checkRaid(); processGifts(); } else { S.name=SLOTS.find(s=>s.id===me).label; S.cls='knight'; S.screen='create'; } render(); }
  else if(a==='cls'){ const i=document.getElementById('heroname'); if(i)S.name=i.value; S.cls=d.id; render(); }
  else if(a==='create'){ const i=document.getElementById('heroname'); const name=(i?i.value:'').trim().slice(0,12)||SLOTS.find(s=>s.id===me).label;
    H=newHero(name,S.cls||'knight'); feat('joined the Hearthguard'); save(); S.screen='camp'; render(); toast('Welcome, '+name+'. The realm is counting on you.'); }
  else if(a==='rest'){ H.hp=stats(H).hp; sfx.heal(); save(); render(); }
  else if(a==='mute'){ muted=!muted; lsSet('hg_mute',muted); render(); }
  else if(a==='level'){ const n=+d.n; if(n>H.cleared)return; startLevel(Math.min(LEVELS-1,n)); }
  else if(a==='expotion'){ const st=stats(H); if(H.potions<1||H.hp>=st.hp)return; H.potions--; H.hp=Math.min(st.hp,H.hp+Math.round(st.hp*.4)); sfx.heal(); save(); render(); }
  else if(a==='exleave'){ EX.busy=true; EX.over=`<div class="panel col" style="text-align:center;min-width:260px"><h2>Back to camp?</h2><p class="dim">You will start this level over next time.</p><div class="grid2"><button data-act="exstay">Keep exploring</button><button class="go" data-act="excamp">Go to camp</button></div></div>`; render(); }
  else if(a==='exstay'){ EX.over=null; EX.busy=false; render(); }
  else if(a==='excamp'){ stopExplore(); S.screen='camp'; checkRaid(); processGifts(); render(); }
  else if(a==='raid'){ if(raidLeft()<1)return toast('You have struck three times today. Ashmaw will still be here tomorrow.'); const st=stats(H), hp=raidHp(); if(hp<=0)return; H.hp=st.hp;
    battle({n:RAID[0],id:RAID[1],hp,max:raidMax(world.no),atk:7+2*H.lvl+st.def,kind:'raid',big:true,xp:0,gold:0,scene:6},{raid:true}).then(()=>{ S.screen='guild'; checkRaid(); render(); }); }
  else if(a==='buy'){ if(d.id==='potion'){ if(H.gold<potionPrice()||H.potions>=9)return; H.gold-=potionPrice(); H.potions++; }
    else { const nx=H[d.id]+1; if(nx>GEAR_MAX||H.lvl<GEAR_LVL[nx])return; const cost=gearCost(d.id); if(H.gold<cost)return; const changed=look(nx)!==look(nx-1); H.gold-=cost; H[gxKey(d.id)]=0; gearUp(d.id);
      if(changed){toast('Your hero has a new look!');sfx.win()} }
    sfx.heal(); save(); render(); }
  else if(a==='gift'){ sendGift(d.id,d.k); }
  else if(a==='sendlink'){ const url=shareLink(); if(!url)return;
    if(navigator.share){ navigator.share({title:'Hearthguard',text:'Join our guild in Hearthguard',url}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('Link copied. Paste it in a message.'),()=>toast('Could not copy the link. Use the QR code.')); }
    else toast('Use the QR code to share.'); }
  else if(a==='unlock'){ const i=document.getElementById('fampw'), v=canonPw(i?i.value:''); if(!v)return; sha256hex(v).then(k=>{ lsSet('hg_key',k); S.lockMsg=''; S.screen='who'; render(); connect(); keepInvite(k); }); }
});
async function sendGift(to,kind){ if(!db)return; const who=(heroes[to]||{}).name||'them';
  if(kind==='potion'){ if(H.potions<1)return toast('You have no potions to give.'); H.potions--; } else { if(H.gold<25)return toast('You need 25 gold to give.'); H.gold-=25; }
  save(); render();
  try{ await db.collection('gifts').add({to,from:H.name,kind,t:Date.now()}); toast('Sent to '+who+'.'); }
  catch(e){ if(kind==='potion')H.potions++; else H.gold+=25; save(); render(); toast('The gift could not be sent. Nothing was lost.'); } }
start();
</script>
