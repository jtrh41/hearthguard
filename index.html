var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,

<style>
/* Layout: one-screen phone-first game column; a painted battle stage with rendered 3D characters on top, chunky wooden buttons below. Single dark castle-stone theme by choice (slate greys, heraldic blue and gold). */
:root{
  color-scheme:dark;
  --night:#14171b; --wood:#252a30; --wood2:#333a43; --line:#5b6672;
  --parch:#e9edf1; --dim:#9ba6b2; --ember:#ec8a3c; --gold:#e8c45e;
  --moss:#86b56a; --blood:#d6553f; --frost:#7fb7d9;

}
html,body{height:100%}
body{background:var(--night);color:var(--parch);font-family:var(--ui);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% 110%,#2c3542 0%,transparent 60%);background-attachment:fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 20px}
h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:.9;margin:0;color:var(--gold);text-shadow:0 3px 0 #3a3320;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;color:var(--gold)}
h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:800}
p{margin:0}
.dim{color:var(--dim)} .gold{color:var(--gold)} .small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--wood);border:2px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 3px 0 #08090b}
button{font:inherit;color:var(--parch);background:var(--wood2);border:2px solid var(--line);border-bottom-width:5px;border-radius:10px;
  padding:10px 12px;cursor:pointer;text-align:center;min-height:48px;font-weight:800}
button:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.go{background:#2c5596;border-color:#6d9be0;color:#f2f6ff}
button.ghost{background:none;border-bottom-width:2px;min-height:40px;padding:6px 10px;font-weight:600;font-size:14px}

button.go .sub{color:#c5d8f5}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spr{width:96px;height:96px;flex:none;object-fit:contain}
.spr.sm{width:56px;height:56px}

.locked{opacity:.5}

/* battle */
.stage{position:relative;aspect-ratio:16/10;max-width:100%;border:2px solid var(--line);border-radius:10px;overflow:hidden}

.stage .foe.big{width:56%;right:-3%;bottom:0}

.flash{position:absolute;inset:0;z-index:4;background:radial-gradient(circle,#fff8d0,#f2c35b 60%,transparent);animation:flash .7s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.shout{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:5;font-family:var(--display);font-size:44px;color:#fff;text-shadow:0 3px 0 #2c3542,0 0 14px #e8c45e;animation:shout 1s ease-out forwards;pointer-events:none}
@keyframes shout{from{transform:scale(.5);opacity:0}25%{transform:scale(1.15);opacity:1}70%{opacity:1}to{transform:scale(1);opacity:0}}
.pop{position:absolute;z-index:3;font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .8s ease-out forwards;pointer-events:none}
.pop.heal{color:#a8e88a} .pop.crit{color:var(--gold);font-size:36px}
@keyframes pop{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
.lunge{animation:lunge .4s} .lungeL{animation:lungeL .4s} .shake{animation:shake .35s}

@keyframes shake{20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-5%)}80%{transform:translateX(5%)}}
.bob{animation:bob 2.4s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-2.5%)}}
.log{min-height:62px;font-size:15px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.log p:last-child{color:var(--parch)} .log p{color:var(--dim)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button.wide{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:#0c0e11;color:var(--gold)}

  border-radius:10px;padding:10px 14px;max-width:min(90vw,460px);text-align:center;z-index:20;box-shadow:0 4px 0 #000}
.aura{position:absolute;z-index:0;border-radius:50%;opacity:.6;pointer-events:none}
.feat{font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.feat:first-child{border-top:0;padding-top:0}

    subs.heroes.forEach(f=>f({docs:Object.keys(st.heroes).map(id=>({id,data:()=>st.heroes[id]})),metadata:{fromCache:false}}));
    subs.world.forEach(f=>f({exists:true,data:()=>st.world})); subs.gifts.forEach(f=>f({docs:st.gifts.map(g=>({id:g.id,data:()=>g}))})); };

      const r=await fetch(url+'/hg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({key},body))});
      if(r.status===403){ dead=true; clearInterval(tick); lsSet('hg_key',null); try{document.cookie='hg-key=; max-age=0; path='+location.pathname}catch(e){} db=null; S.lockMsg='That password did not work. Try again.'; B=null; S.screen='lock'; render(); throw {code:'key'} }

function addXp(xp){ let ups=0; H.xp+=xp; while(H.lvl<30&&H.xp>=need(H.lvl)){H.xp-=need(H.lvl);H.lvl++;ups++}
  if(ups){H.hp=stats(H).hp; if(H.lvl%5===0)feat('reached level '+H.lvl)} return ups; }

/* ============ BATTLE ============ */
function baseB(e,sc,log){ return {e:Object.assign({stun:0,weak:0,poison:0,pdmg:0,charge:false},e),cd:[0,0,0],guard:0,bless:0,eagle:0,et:0,busy:false,log:[log],sc}; }
function startBattle(r,stage){ // stage 0-4, -1 hunt
  const R=REGIONS[r], boss=stage===4, m=boss?R.boss:R.mobs[stage<0?Math.floor(Math.random()*3):stage%3];
  const sc=stage<0?1.2:1+.1*stage;
  const hp=Math.round(R.hp*sc*(boss?2.6:1)), atk=R.atk*(stage<0?1.1:1+.06*stage)*(boss?1.35:1);
  B=Object.assign(baseB({n:m.n,id:m.id,hp,max:hp,atk},r,boss?m.n+' rises before you!':m.n+' blocks the path!'),{r,stage,boss});
  preload(heroImg(H,true)); preload(mobImg(m.id,true));
  S.screen='battle'; render();
}
function startRaid(){ if(raidLeft()<1)return toast('You have struck three times today. Ashmaw will still be here tomorrow.');
  const st=stats(H); H.hp=st.hp; const hp=raidHp(); if(hp<=0)return;
  B=Object.assign(baseB({n:RAID.n,id:RAID.id,hp,max:raidMax(world.no),atk:7+2*H.lvl+st.def},4,'Ashmaw towers over you. You have 8 turns to strike!'),{raid:true,boss:true,turns:8,dealt:0});
  preload(heroImg(H,true)); S.screen='battle'; render();
}
function blog(t){B.log.push(t); if(B.log.length>3)B.log.shift()}
function pop(sel,text,cls){const st=app.querySelector('.stage'),el=app.querySelector(sel); if(!st||!el)return;
  const d=document.createElement('div'); d.className='pop '+(cls||''); d.textContent=text; d.style.left=(el.offsetLeft+el.offsetWidth/2-18)+'px'; d.style.top=(el.offsetTop+el.offsetHeight*.15)+'px'; st.appendChild(d); setTimeout(()=>d.remove(),800);}
function anim(sel,cls,frame){const el=app.querySelector(sel); if(!el)return; el.classList.remove('bob',cls); void el.offsetWidth; el.classList.add(cls);
  if(frame){const old=el.getAttribute('src'); el.src=frame; setTimeout(()=>{if(el.isConnected)el.src=old},430)} }
function strike(mult,forceCrit){ const st=stats(H); let d=st.atk*mult*rnd(.88,1.12); if(B.bless>0)d*=1.4;
  let crit=forceCrit||Math.random()<st.crit; if(!forceCrit&&B.eagle>0){crit=true;B.eagle--} if(crit)d*=1.8;
  d=Math.max(1,Math.round(d)); B.e.hp=Math.max(0,B.e.hp-d); if(B.raid)B.dealt+=d; return {d,crit}; }
async function heroAct(kind){ if(!B||B.busy||B.result)return; const st=stats(H), e=B.e, c=CLASSES[H.cls]; let pops=[], power=false;
  if(kind==='potion'){ if(H.potions<1)return toast('No potions left.'); if(H.hp>=st.hp)return toast('You are already at full health.');
    H.potions--; const h=Math.round(st.hp*.4); H.hp=Math.min(st.hp,H.hp+h); blog('You drink a potion and heal '+h+'.'); pops.push(['.you','+'+h,'heal']); sfx.heal(); }
  else { const sk=kind==='atk'?{n:'Attack',mult:1}:kind==='pow'?c.power:c.skills[kind];
    if(kind==='pow'){ if((H.pow||0)<100)return; power=true; H.pow=0; }
    else if(kind!=='atk'&&(B.cd[kind]>0||H.lvl<sk.lv))return;
    let line=kind==='atk'?'You attack':'You use '+sk.n;
    if(sk.mult){ let total=0,anyCrit=false; for(let i=0;i<(sk.hits||1);i++){const s=strike(sk.mult,sk.allcrit); total+=s.d; anyCrit=anyCrit||s.crit}
      line+=' for '+total+(anyCrit?', a critical hit!':'.'); pops.push(['.foe','-'+total,anyCrit||power?'crit':'']); if(!power)(anyCrit?sfx.crit():sfx.hit());
      if(!power)H.pow=Math.min(100,(H.pow||0)+22); } else line+='.';
    if(sk.heal){const h=Math.round(st.hp*sk.heal); H.hp=Math.min(st.hp,H.hp+h); pops.push(['.you','+'+h,'heal']); if(!power)sfx.heal()}
    if(sk.stun&&!B.raid)e.stun=sk.stun; if(sk.weak)e.weak=sk.weak; if(sk.poison){e.poison=sk.poison;e.pdmg=Math.max(1,Math.round(st.atk*.45))}
    if(sk.guard)B.guard=sk.guard; if(sk.bless)B.bless=sk.bless; if(sk.eagle)B.eagle=sk.eagle;
    blog(line); }
  B.busy=true; for(let i=0;i<3;i++)if(B.cd[i]>0)B.cd[i]--; if(typeof kind==='number')B.cd[kind]=c.skills[kind].cd;
  render();
  if(power){ sfx.power(); const stg=app.querySelector('.stage'); if(stg){const f=document.createElement('div');f.className='flash';stg.appendChild(f); const t=document.createElement('div');t.className='shout';t.textContent=c.power.n+'!';stg.appendChild(t); setTimeout(()=>{f.remove();t.remove()},1000)} await sleep(350); }
  if(pops.some(p=>p[0]==='.foe')){anim('.you','lunge',heroImg(H,true));anim('.foe','shake')} pops.forEach(p=>pop(p[0],p[1],p[2]));
  await sleep(power?900:600); if(e.hp<=0)return finish(true);
  await enemyTurn(); if(!B||B.result)return; B.busy=false; render(); }
async function enemyTurn(){ const e=B.e, st=stats(H);
  if(e.poison>0){ e.hp=Math.max(0,e.hp-e.pdmg); if(B.raid)B.dealt+=e.pdmg; e.poison--; blog('Poison burns '+e.n+' for '+e.pdmg+'.'); render(); pop('.foe','-'+e.pdmg); await sleep(450); if(e.hp<=0)return finish(true); }
  if(e.stun>0){ e.stun--; blog(e.n+' is stunned and cannot move!'); render(); await sleep(500); }
  else { let d=e.atk*rnd(.85,1.15); if(e.weak>0){d*=.7;e.weak--} const heavy=e.charge; if(heavy){d*=1.8;e.charge=false}
    d=Math.max(1,Math.round(d-st.def)); if(B.guard>0)d=Math.ceil(d/2);
    H.hp=Math.max(0,H.hp-d); H.pow=Math.min(100,(H.pow||0)+14); blog(e.n+(heavy?' unleashes a mighty blow for ':' hits you for ')+d+'.'); render(); anim('.foe','lungeL',mobImg(e.id,true)); anim('.you','shake'); pop('.you','-'+d); sfx.hurt(); await sleep(600);
    B.et++; if(B.boss&&B.et%3===2&&H.hp>0){e.charge=true; blog(e.n+' is gathering power…')} }
  if(B.guard>0)B.guard--; if(B.bless>0)B.bless--;
  if(H.hp<=0)return finish(false);
  if(B.raid){B.turns--; if(B.turns<=0)return finish(false,true)} }
function finish(win,flew){ const st=stats(H);
  if(B.raid){ const dealt=B.dealt; if(H.raidDay!==today()){H.raidDay=today();H.raidTries=0} H.raidTries++; if((H.raidNo||1)!==world.no){H.raidNo=world.no;H.raidDmg=0}
    H.raidDmg=(H.raidDmg||0)+dealt; H.hp=st.hp; if(dealt>0)feat('struck Ashmaw for '+dealt); save();
    B.result={raid:true,dealt,win,flew}; win?sfx.win():sfx.hit(); render(); return; }
  const R=REGIONS[B.r]; let res={win};
  if(win){ let g=Math.round(R.gold*rnd(.85,1.15)*(B.boss?5:1)*((H.relics||[]).includes(0)?1.2:1)), xp=R.xp*(B.boss?4:1);
    H.gold+=g; H.kills=(H.kills||0)+1; res.gold=g; res.xp=xp;
    if(B.stage>=0&&B.stage===H.prog[B.r]){ H.prog[B.r]++; if(B.boss){ if(!H.relics.includes(B.r)){H.relics.push(B.r);res.relic=B.r} feat('defeated '+R.boss.n+' in '+R.n) } }
    const r0=rank(H); res.ups=addXp(xp); if(rank(H)>r0)res.rank=rank(H); res.gear=addGearXp(Math.round(R.gold*(B.boss?5:1))); if(H.relics.includes(2)&&!res.ups)H.hp=Math.min(stats(H).hp,H.hp+Math.round(stats(H).hp*.15));
    sfx.win(); }
  else { H.hp=st.hp; sfx.lose(); }
  save(); B.result=res; render(); }

  let bottom;
  if(res){ let t='',btn='';
    if(res.raid){ t=`<h2>${res.win?'Ashmaw falls!':res.flew?'Time is up':'Knocked back'}</h2><p>You dealt <b class="gold">${res.dealt}</b> damage for the family.</p>`; btn=`<button class="go" data-act="go" data-to="guild">Back to the Guild Hall</button>`; }
    else if(res.win){ const more=B.stage>=0&&H.prog[B.r]<5;
      t=`<h2>Victory!</h2><p>+${res.gold} gold · +${res.xp} XP</p>${res.ups?`<p class="gold">Level up! You are now level ${H.lvl}.</p>`:''}${res.rank?`<p class="gold">New rank: ${RANKS[res.rank]}! Your hero looks stronger.</p>`:''}${(res.gear||[]).map(g=>`<p class="gold">Your ${g.k} grew to level ${H[g.k]+1}: ${gearName(H,g.k,H[g.k])}.${g.look?' New look!':''}</p>`).join('')}${res.relic!=null?`<p class="gold">Relic found: ${REGIONS[res.relic].relic} (${REGIONS[res.relic].rd})</p>`:''}`;
      btn=`<div class="grid2"><button class="go" data-act="fight" data-r="${B.r}" data-s="${more?H.prog[B.r]:-1}">${more?(H.prog[B.r]===4?'Face the boss':'Next stage'):'Hunt again'}</button><button data-act="go" data-to="camp">Camp</button></div>`; }
    else { t=`<h2>Knocked out</h2><p class="dim">Your friends carry you back to the fire. Rest, gear up, and try again.</p>`; btn=`<button class="go" data-act="go" data-to="camp">Back to camp</button>`; }
    bottom=`<div class="panel col" style="text-align:center">${t}</div>${btn}`;
  } else {
    bottom=`<div class="log">${B.log.map(l=>`<p>${esc(l)}</p>`).join('')}</div><div class="acts">
      ${pw>=100?`<button class="pow" data-act="act" data-k="pow" ${B.busy?'disabled':''}>${c.power.n}!<span class="sub">${c.power.d}</span></button>`:''}
      <button class="go wide" data-act="act" data-k="atk" ${B.busy?'disabled':''}>Attack</button>
      ${c.skills.map((s,i)=>`<button data-act="act" data-k="${i}" ${B.busy||B.cd[i]>0||H.lvl<s.lv?'disabled':''}>${s.n}<span class="sub">${H.lvl<s.lv?'Level '+s.lv:B.cd[i]>0?'Ready in '+B.cd[i]:s.d}</span></button>`).join('')}
      <button data-act="act" data-k="potion" ${B.busy||H.potions<1?'disabled':''}>Potion<span class="sub">${H.potions} left</span></button></div>`;
  }
  return `<div class="stage">${scene(B.sc)}<div class="tag"><div class="stat"><span>${esc(e.n)}</span><span>${e.hp} / ${e.max}</span></div>${bar(e.hp,e.max,B.raid?'raid':'foe')}</div>
    ${aura(H,'left:2%;width:40%;bottom:0;height:18%')}<img class="you ${res&&!res.win&&!res.raid?'':'bob'}" alt="Your hero" src="${heroImg(H)}" style="width:${37+rank(H)*1.5}%;${heroFx(H)}${res&&!res.win&&!res.raid?'opacity:.5':''}"><img class="foe ${B.boss?'big':''} ${e.hp>0?'bob':''}" alt="${esc(e.n)}" src="${mobImg(e.id)}" style="animation-delay:-1.1s;${e.hp<=0?'opacity:.2':''}"></div>
  <div class="col" style="gap:5px"><div class="stat"><b>${esc(H.name)} · Level ${H.lvl}</b><span>${H.hp} / ${st.hp}</span></div>${bar(H.hp,st.hp)}
    <div class="row"><span class="small ${pw>=100?'gold':'dim'}" style="width:52px">Power</span><div class="grow">${bar(pw,100,'pw'+(pw>=100?' full':''))}</div></div><div class="chips">${chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>${bottom}`;
}
function shareLink(){ const k=lsGet('hg_key'); return window.HG_CLOUD&&k?location.origin+location.pathname+'#key='+k:null; }
function qrSvg(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(), m=3; let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+m*2} ${n+m*2}" role="img" aria-label="QR code to play Hearthguard" shape-rendering="crispEdges" style="width:min(100%,300px);align-self:center;border-radius:8px"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }
function vShare(){ const url=shareLink(), back=H?'camp':'who';
  if(!url||typeof qrcode!=='function')return `<div class="top"><h2>Share the game</h2><button class="ghost" data-act="go" data-to="${back}">Back</button></div><div class="panel"><p>Sharing works from the home-screen game.</p></div>`;
  return `<div class="top"><h2>Share the game</h2><button class="ghost" data-act="go" data-to="${back}">Back</button></div>
  <div class="panel col"><p>Scan this with a phone or iPad camera. Then tap Share, Add to Home Screen, and play from that icon.</p>${qrSvg(url)}
  <p class="dim small">Only share this with family. Anyone who scans it joins our guild.</p>
  <button class="go" data-act="sendlink">Send the link</button></div>`; }
const VIEWS={share:vShare,lock:vLock,who:vWho,create:vCreate,camp:vCamp,map:vMap,shop:vShop,hero:vHero,guild:vGuild,battle:vBattle};
function render(){ if(S.screen!=='who'&&S.screen!=='create'&&S.screen!=='lock'&&S.screen!=='share'&&!H)S.screen='who'; if(S.screen==='battle'&&!B)S.screen='camp';
  const keep=S.screen==='battle'; const y=window.scrollY; app.innerHTML=VIEWS[S.screen](); if(keep)window.scrollTo(0,y); }

/* ============ INPUT ============ */
app.addEventListener('click',ev=>{ const b=ev.target.closest('[data-act]'); if(!b||b.disabled)return; const a=b.dataset.act, d=b.dataset;
  if(a==='act'){ heroAct(d.k==='atk'||d.k==='potion'||d.k==='pow'?d.k:+d.k); return; }
  sfx.tap();
  if(a==='go'){ if(S.screen==='create'){const i=document.getElementById('heroname'); if(i)S.name=i.value} B=null; S.screen=d.to; if(d.to==='camp'||d.to==='guild'){checkRaid();processGifts()} render(); window.scrollTo(0,0); }
  else if(a==='pick'){ me=d.id; lsSet('hg_me',me); const loc=lsGet('hg_hero_'+me), rem=heroes[me]; H=rem&&(!loc||(rem.rev||0)>=(loc.rev||0))?clone(rem):loc; if(H&&!CLASSES[H.cls])H=null;
    if(H){ if(!rem||(rem.rev||0)<(H.rev||0)){dirty=true;pump()} S.screen='camp'; checkRaid(); processGifts(); } else { S.name=SLOTS.find(s=>s.id===me).label; S.cls='knight'; S.screen='create'; } render(); }
  else if(a==='cls'){ const i=document.getElementById('heroname'); if(i)S.name=i.value; S.cls=d.id; render(); }
  else if(a==='create'){ const i=document.getElementById('heroname'); const name=(i?i.value:'').trim().slice(0,12)||SLOTS.find(s=>s.id===me).label;
    H=newHero(name,S.cls||'knight'); feat('joined the Hearthguard'); save(); S.screen='camp'; render(); toast('Welcome, '+name+'. The realm is counting on you.'); }
  else if(a==='rest'){ H.hp=stats(H).hp; sfx.heal(); save(); render(); }
  else if(a==='mute'){ muted=!muted; lsSet('hg_mute',muted); render(); }
  else if(a==='fight'){ startBattle(+d.r,+d.s); window.scrollTo(0,0); }
  else if(a==='raid'){ startRaid(); window.scrollTo(0,0); }
  else if(a==='buy'){ if(d.id==='potion'){ if(H.gold<potionPrice()||H.potions>=9)return; H.gold-=potionPrice(); H.potions++; }
    else { const nx=H[d.id]+1; if(nx>6||H.lvl<GEAR_LVL[nx])return; const cost=gearCost(d.id); if(H.gold<cost)return; const changed=look(nx)!==look(nx-1); H.gold-=cost; H[gxKey(d.id)]=0; gearUp(d.id);
      if(changed){toast('Your hero has a new look!');sfx.win()} }
    sfx.heal(); save(); render(); }
  else if(a==='gift'){ sendGift(d.id,d.k); }
  else if(a==='sendlink'){ const url=shareLink(); if(!url)return;
    if(navigator.share){ navigator.share({title:'Hearthguard',text:'Join our guild in Hearthguard',url}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('Link copied. Paste it in a message.'),()=>toast('Could not copy the link. Use the QR code.')); }
    else toast('Use the QR code to share.'); }
  else if(a==='unlock'){ const i=document.getElementById('fampw'), v=canonPw(i?i.value:''); if(!v)return; sha256hex(v).then(k=>{ lsSet('hg_key',k); S.lockMsg=''; S.screen='who'; render(); connect(); keepInvite(k); }); }
});
async function sendGift(to,kind){ if(!db)return; const who=(heroes[to]||{}).name||'them';
  if(kind==='potion'){ if(H.potions<1)return toast('You have no potions to give.'); H.potions--; } else { if(H.gold<25)return toast('You need 25 gold to give.'); H.gold-=25; }
  save(); render();
  try{ await db.collection('gifts').add({to,from:H.name,kind,t:Date.now()}); toast('Sent to '+who+'.'); }
  catch(e){ if(kind==='potion')H.potions++; else H.gold+=25; save(); render(); toast('The gift could not be sent. Nothing was lost.'); } }

if(H&&!CLASSES[H.cls])H=null;
/* Invites (home-screen build). A QR/link carries #key=<saved key> (or #join=<password>). A home-screen app has its own storage on iPhones,
   so the invite travels with Add to Home Screen: in the link the icon starts on, and in a cookie. */
function keepInvite(k){
  const base=location.origin+location.pathname, join=base+'#key='+k;
  try{document.cookie='hg-key='+k+'; path='+location.pathname+'; max-age=31536000; SameSite=Lax; Secure'}catch(e){}
  if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)return;
  document.querySelectorAll('link[rel=manifest]').forEach(l=>l.remove());
  const man={name:'Hearthguard',short_name:'Hearthguard',start_url:join,scope:base,display:'standalone',background_color:'#14171b',theme_color:'#14171b',
    icons:[{src:base+'icon-180.png',sizes:'180x180',type:'image/png'},{src:base+'icon-512.png',sizes:'512x512',type:'image/png'}]};
  const l=document.createElement('link'); l.rel='manifest'; l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
  if(lsGet('hg_tip_off'))return;
  const tip=document.createElement('div'); tip.setAttribute('role','status');
  tip.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:#252a30;color:#e9edf1;border:2px solid #e8c45e;border-radius:10px;padding:12px 48px 12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5)';
  tip.textContent='Make it an app: tap Share, then Add to Home Screen, and always play from that icon.';
  const x=document.createElement('button'); x.textContent='✕'; x.setAttribute('aria-label','Close');
  x.style.cssText='position:absolute;top:2px;right:2px;min-height:40px;width:40px;padding:0;background:none;border:0;color:#e9edf1;font-size:18px';
  x.addEventListener('click',()=>{tip.remove();lsSet('hg_tip_off',1)}); tip.appendChild(x); document.body.appendChild(tip);
}
function boot(){ render(); connect(); const k=lsGet('hg_key'); if(window.HG_CLOUD&&k)keepInvite(k); }
if(window.HG_CLOUD){
  let m=/[#&]key=([0-9a-f]{64})/.exec(location.hash), j=/[#&]join=([^&]+)/.exec(location.hash), c=null;
  try{c=/(?:^|; )hg-key=([0-9a-f]{64})/.exec(document.cookie)}catch(e){}
  if(m){lsSet('hg_key',m[1]);boot()}
  else if(j){render(); sha256hex(canonPw(decodeURIComponent(j[1]))).then(k=>{lsSet('hg_key',k);boot()})}
  else { if(!lsGet('hg_key')&&c)lsSet('hg_key',c[1]); boot(); }
} else boot();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script></body></html>
