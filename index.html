var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,

p{margin:0}
.dim{color:var(--dim)} .gold{color:var(--gold)} .small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.pg{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:12px;height:100%}
.scroll{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.panel{background:var(--wood);border:2px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 3px 0 #08090b}

  padding:7px 10px;cursor:pointer;text-align:center;min-height:44px;font-weight:800}

button .sub{display:block;font-weight:400;font-size:12px;color:var(--dim)}
button.go .sub{color:#c5d8f5}

.ttl{height:100%;display:grid;grid-template-rows:minmax(150px,52%) minmax(0,1fr);gap:8px;padding-inline:4px}

/* 5 heroes (session 6): the paladin's long hammer reached into the wizard - nudge each one so everyone has room */
.lineup .port.lu-knight{translate:-10% 0} .lineup .port.lu-paladin{translate:-18% 0} .lineup .port.lu-wizard{translate:14% 0} .lineup .port.lu-ranger{translate:8% 0} .lineup .port.lu-barbarian{translate:2% 0}

.ttl .grid2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.locked{opacity:.5}
.card-wrap{position:relative;display:flex}
.card-wrap .x{position:absolute;top:-6px;right:-6px;min-height:34px;width:34px;padding:0;border-radius:50%;background:#5a1e18;border-color:var(--blood);z-index:2}
.newhero{border-style:dashed} .plus{width:56px;text-align:center;font-size:34px;font-weight:800;color:var(--gold)}
button.danger{background:#7a2418;border-color:var(--blood)}
input[type=text]{font:inherit;color:var(--parch);background:#0c0e11;border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;min-height:44px;-webkit-user-select:text;user-select:text}

.chips{display:flex;gap:5px;flex-wrap:wrap;min-height:20px}

.feat{font-size:13px;border-top:1px solid var(--line);padding-top:5px}
.feat:first-child{border-top:0;padding-top:0}

.scene{position:absolute;inset:0;width:100%;height:100%}
.aura{position:absolute;z-index:0;border-radius:50%;opacity:.6;pointer-events:none}

<script>
"use strict";
/* Hearthguard gear (2026-11-15): weapons, helmets and hoods, chest armour, leg armour and cloaks.
   Every piece is FOUND (monsters, chests, mimics, bosses), has its own stats plus bonus attributes (Strength, Vitality...), and only gets
   stronger when you upgrade it at the Forge with Embers and gold. Nothing upgrades on its own.
   The hero is drawn in layers so each piece shows: cloak, legs, chest, head (a hood replaces it), headpiece, weapon.
   Loaded BEFORE core.js: only constants and functions here, nothing runs at load. */
const GSLOTS=['weapon','head','chest','legs','cloak'];
const SLOT_NAME={weapon:'Weapon',head:'Helmet',chest:'Chest armour',legs:'Leg armour',cloak:'Cloak',pcollar:'Pet collar',pharness:'Pet harness',pcharm:'Pet charm'};
/* pet gear (session 4): found like hero gear, upgraded at the Forge, worn by the pet and drawn on it */
const PSLOTS=['pcollar','pharness','pcharm'];
const isPetItem=it=>PSLOTS.includes(it.s);
const RARITY=[{n:'Common',c:'#c9ced6',m:1,max:5},{n:'Uncommon',c:'#7fd66a',m:1.12,max:7},{n:'Rare',c:'#5fa8ff',m:1.25,max:9},{n:'Epic',c:'#c07bff',m:1.4,max:12},{n:'Legendary',c:'#ffb040',m:1.6,max:15}];
/* armour colours: the layer art is multiplied by this colour in the browser */
const TINTS=[{n:'Leather',c:null},{n:'Iron',c:'#c3ccd8'},{n:'Gilded',c:'#ffd56a'},{n:'Shadow',c:'#8c7ad0'},{n:'Crimson',c:'#ee6d64'},{n:'Frost',c:'#a6dcff'},{n:'Emerald',c:'#7fe08a'}];
const HEADS={helm:'Knight’s Helm',hat:'Wizard Hat',horns:'Horned Helm',hood:'Ranger Hood'};
const CHEST_WORD=['Jerkin','Cuirass','Plate','Mail','Brigandine','Plate','Scale Mail'];
const STARTER={knight:'k_sword',wizard:'w_staff',ranger:'r_bow',barbarian:'b_hatchet',paladin:'p_hammer'};   // wizards use staffs, rangers bows, barbarians axes
const CLASS_HEAD={knight:'helm',wizard:'hat',ranger:'hood',barbarian:'horns',paladin:'helm'};
/* class-only armour (session 5, owner: "an archer should not wear the same thing as a knight"): every class finds only its own armour,
   with its own names, in three looks that change shape: plain, '_b' (rare and epic finds) and '_c' (legendary). Art: tools/armour_looks.py.
   Chest/leg items keep the look in k ('', 'b', 'c'); headgear k is the class headpiece + look ('hood', 'hood_b', 'hood_c'). */
const ARMOUR={
 knight:{chest:['Chainmail Hauberk','Plate Cuirass','Crusader Plate'],legs:['Mail Chausses','Plate Greaves','Crusader Greaves'],head:['Iron Helm','Plumed Helm','Crowned Helm'],cloak:'Knight\u2019s Cloak'},
 paladin:{chest:['Silver Breastplate','Winged Plate','Radiant Plate'],legs:['Silver Greaves','Blessed Greaves','Radiant Greaves'],head:['Paladin Helm','Winged Helm','Haloed Helm'],cloak:'Holy Mantle'},
 wizard:{chest:['Apprentice Robe','Scholar\u2019s Robe','Archmage Robe'],legs:['Robe Skirt','Starweave Skirt','Archmage Skirt'],head:['Wizard Hat','Star-banded Hat','Archmage Hat'],cloak:'Wizard\u2019s Cloak'},
 ranger:{chest:['Leather Jerkin','Studded Leather','Elven Leafmail'],legs:['Leather Leggings','Studded Breeches','Leafweave Leggings'],head:['Ranger Hood','Feathered Hood','Elven Circlet Hood'],cloak:'Ranger\u2019s Cloak'},
 barbarian:{chest:['Fur Vest','Fang Harness','Bone Pelts'],legs:['Fur Breeches','Fur-bound Boots','Bone Breeches'],head:['Horned Helm','Great Horns','Skull Horns'],cloak:'Hide Cloak'}};
const lookOf=it=>{ const k=it&&it.k||''; const m=/(?:^|_)(b|c)$/.exec(k); return m?m[1]:''; };
const lookIdx=it=>({b:1,c:2})[lookOf(it)]||0;
const lookFor=r=>r>=4?'c':r>=2?'b':'';
/* the layer an armour piece draws with; looks fall back to the plain piece until their art ships (ART.alooks) */
function armourLayer(h,it,slot){ const lk=it&&ART.alooks?lookOf(it):'';
  if(slot==='head')return CLASS_HEAD[h.cls]+(lk?'_'+lk:'');
  return slot+(lk&&slot!=='cloak'?'_'+lk:''); }
/* older saves: headgear from another class becomes this class's own headpiece (same rarity, level, colour and upgrades) */
function fixClassGear(h){ if(!h||!h.bag)return; for(const it of h.bag){ if(it.s==='head'&&it.k.split('_')[0]!==CLASS_HEAD[h.cls])it.k=CLASS_HEAD[h.cls]+(lookOf(it)?'_'+lookOf(it):''); } }
/* weapons: class, grip (which body poses), name, bonus attack, and the weapon's own skill. anim = which animation it plays ('a' attack, 0-2 skill poses). */
const WEAPONS={
 k_sword:{c:'knight',g:'1h',n:'Arming Sword'},
 k_shield:{c:'knight',g:'1h',n:'Sword and Shield',b:.05,sk:{n:'Shield Bash',cd:4,mult:1.4,stun:1,anim:1,fx:'stun',d:'Slam with the shield and stun'}},
 k_spike:{c:'knight',g:'1h',n:'Spiked Bulwark',b:.08,sk:{n:'Spike Rush',cd:4,mult:1.5,poison:3,anim:1,fx:'bleed',d:'Spikes that make foes bleed'}},
 k_grave:{c:'knight',g:'1h',n:'Grave Blade',b:.1,sk:{n:'Soul Reap',cd:4,mult:1.5,drain:.5,anim:0,fx:'drain',d:'Strike and heal half the damage'}},
 k_twin:{c:'knight',g:'dual',n:'Twin Blades',b:.08,sk:{n:'Twin Fury',cd:3,mult:.8,hits:3,spread:1,anim:'a',fx:'spin',d:'Three fast cuts across the foes'}},
 k_great:{c:'knight',g:'2h',n:'Greatsword',b:.12,sk:{n:'Sundering Strike',cd:5,mult:2.6,anim:0,fx:'heavy',d:'One enormous chop'}},
 k_rune:{c:'knight',g:'2h',n:'Runeblade',b:.14,sk:{n:'Rune Storm',cd:5,mult:1.6,aoe:1,weak:2,anim:2,fx:'rune',d:'A spinning rune blast at every foe'}},
 w_staff:{c:'wizard',g:'2h',n:'Oak Staff'},
 w_tome:{c:'wizard',g:'2h',n:'Staff and Tome',b:.08,sk:{n:'Chain Lightning',cd:4,mult:1.2,aoe:1,anim:0,fx:'lightning',d:'Lightning jumps to every foe'}},
 w_crystal:{c:'wizard',g:'2h',n:'Crystal Staff',b:.1,sk:{n:'Arcane Missiles',cd:3,mult:.7,hits:4,spread:1,anim:0,fx:'arcane',d:'Four missiles across the foes'}},
 w_frost:{c:'wizard',g:'2h',n:'Frost Staff',b:.12,sk:{n:'Blizzard',cd:5,mult:1.1,aoe:1,weak:2,anim:2,fx:'frost',d:'Ice on every foe, weakening them'}},
 w_ember:{c:'wizard',g:'2h',n:'Ember Staff',b:.13,sk:{n:'Firestorm',cd:5,mult:1.4,aoe:1,anim:2,fx:'fire',d:'Fire rains on every foe'}},
 w_lich:{c:'wizard',g:'2h',n:'Lich Staff',b:.14,sk:{n:'Soul Drain',cd:4,mult:1.8,drain:.6,anim:1,fx:'drain',d:'Drain life from a foe'}},
 r_bow:{c:'ranger',g:'bow',n:'Hunting Bow'},
 r_long:{c:'ranger',g:'bow',n:'Longbow',b:.08,sk:{n:'Piercing Arrow',cd:4,mult:1.4,aoe:1,anim:0,fx:'pierce',d:'An arrow through every foe'}},
 r_recurve:{c:'ranger',g:'bow',n:'Recurve Bow',b:.1,sk:{n:'Volley',cd:3,mult:.7,hits:4,spread:1,anim:0,fx:'arrow',d:'Four arrows across the foes'}},
 r_bonebow:{c:'ranger',g:'bow',n:'Bone Bow',b:.12,sk:{n:'Hex Arrow',cd:4,mult:1.2,poison:4,weak:2,anim:1,fx:'hex',d:'A cursed arrow: poison and weaken'}},
 r_elven:{c:'ranger',g:'bow',n:'Elven Bow',b:.13,sk:{n:'Moonlit Shot',cd:4,mult:1.6,stun:1,anim:2,fx:'arcane',d:'A glowing arrow that stuns'}},
 r_dragon:{c:'ranger',g:'bow',n:'Dragonbone Bow',b:.15,sk:{n:'Dragonfire Arrow',cd:5,mult:1.5,aoe:1,weak:1,anim:2,fx:'fire',d:'A burning arrow that bursts over every foe'}},
 b_hatchet:{c:'barbarian',g:'1h',n:'Hatchet'},
 b_shield:{c:'barbarian',g:'1h',n:'Axe and Shield',b:.05,sk:{n:'Shield Slam',cd:4,mult:1.4,stun:1,anim:0,fx:'stun',d:'Slam and stun'}},
 b_mug:{c:'barbarian',g:'1h',n:'Axe and Tankard',b:.04,sk:{n:'Hearty Swig',cd:4,heal:.35,bless:2,anim:1,fx:'heal',d:'Drink up: heal and hit harder'}},
 b_bone:{c:'barbarian',g:'1h',n:'Bone Cleaver',b:.1,sk:{n:'Bloodletting',cd:4,mult:1.3,poison:4,anim:0,fx:'bleed',d:'A cut that keeps bleeding'}},
 b_axe:{c:'barbarian',g:'2h',n:'Battle Axe',b:.12,sk:{n:'Earthshaker',cd:5,mult:1.5,aoe:1,weak:2,anim:0,fx:'heavy',d:'Shake the ground under every foe'}},
 /* Paladin warhammers (session 5): all big two-handed hammers, built in Blender (tools/paladin.py) */
 p_hammer:{c:'paladin',g:'2h',n:'Iron Warhammer'},
 p_maul:{c:'paladin',g:'2h',n:'Stone Maul',b:.06,sk:{n:'Groundbreaker',cd:5,mult:1.2,aoe:1,stun:1,anim:2,fx:'stun',d:'Pound the ground and stun every foe'}},
 p_flanged:{c:'paladin',g:'2h',n:'Flanged Greatmace',b:.08,sk:{n:'Rending Blow',cd:4,mult:1.5,poison:3,anim:0,fx:'bleed',d:'Wounds that keep bleeding'}},
 p_holy:{c:'paladin',g:'2h',n:'Hammer of Mercy',b:.1,sk:{n:'Mercy',cd:4,mult:1.2,heal:.25,petheal:.3,anim:0,fx:'holy',d:'Strike, and heal you and your pet'}},
 p_dawn:{c:'paladin',g:'2h',n:'Dawnbringer',b:.12,sk:{n:'Sunburst',cd:5,mult:1.7,aoe:1,anim:2,fx:'holy',d:'A burst of sunlight at every foe'}},
 p_titan:{c:'paladin',g:'2h',n:'Titan Hammer',b:.15,sk:{n:'Thunderclap',cd:5,mult:2.8,anim:0,fx:'heavy',d:'One crushing blow that shakes the ground'}},
 b_twin:{c:'barbarian',g:'dual',n:'Twin Axes',b:.1,sk:{n:'Whirlwind',cd:4,mult:.9,hits:2,aoe:1,anim:0,fx:'spin',d:'Spin through every foe twice'}},
};
/* which moves fly through the air, per grip (the rest run up and hit) */
function animRanged(cls,grip,anim){ return cls==='wizard'||cls==='ranger'; }
/* bonus attributes */
const ATTR={
 str:{n:'Strength',d:'attack',f:il=>Math.round(il*.45*rnd(.7,1.25)+1)},
 vit:{n:'Vitality',d:'health',f:il=>Math.round(il*2.4*rnd(.7,1.25)+4)},
 def:{n:'Toughness',d:'defense',f:il=>Math.max(1,Math.round(il*.12*rnd(.7,1.25)))},
 crit:{n:'Precision',d:'critical chance',u:'%',f:()=>Math.round(rnd(2,6))},
 luck:{n:'Fortune',d:'more gold',u:'%',f:()=>Math.round(rnd(6,16))},
 focus:{n:'Focus',d:'faster power bar',u:'%',f:()=>Math.round(rnd(10,25))},
 leech:{n:'Lifesteal',d:'of damage healed',u:'%',f:()=>Math.round(rnd(3,8))},
};
const BASE={weapon:{atk:1.2},head:{hp:1.5,def:.08},chest:{hp:3,def:.15},legs:{hp:2,def:.1},cloak:{hp:1,def:.05},pcollar:{patk:.55},pharness:{php:2.2},pcharm:{patk:.25,php:.8}};
let itemSeq=0;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mkItem(slot,kind,r,il,t){ const it={i:Date.now().toString(36)+(itemSeq++).toString(36)+Math.floor(Math.random()*36).toString(36),s:slot,k:kind,r,il:Math.max(1,Math.round(il)),lv:0,t:t||0,a:{}};
  const keys=(PSLOTS.includes(slot)?['str','vit','crit']:Object.keys(ATTR)).sort(()=>Math.random()-.5).slice(0,Math.min(PSLOTS.includes(slot)?3:9,r+(slot==='cloak'?1:0))); keys.forEach(k=>it.a[k]=ATTR[k].f(it.il)); return it; }
const ipow=it=>it.il*RARITY[it.r].m*(1+.12*it.lv);
const attrVal=(it,k)=>Math.round(it.a[k]*(1+.1*it.lv));
function itemStats(it){ const p=ipow(it), b=BASE[it.s], o={atk:0,hp:0,def:0,crit:0,luck:0,focus:0,leech:0}; if(isPetItem(it))return o;
  if(b.atk)o.atk+=Math.round(b.atk*p*(1+((WEAPONS[it.k]||{}).b||0))+2); if(b.hp)o.hp+=Math.round(b.hp*p+3); if(b.def)o.def+=Math.round(b.def*p);
  for(const k in it.a){ const v=attrVal(it,k); if(k==='str')o.atk+=v; else if(k==='vit')o.hp+=v; else if(k==='def')o.def+=v; else o[k]+=v; }
  return o; }
function itemName(it){ const T=TINTS[it.t]||TINTS[0];
  if(it.s==='weapon')return WEAPONS[it.k].n;
  const A=ARMOUR[(H&&H.cls)||'knight']||ARMOUR.knight;
  if(it.s==='head'||it.s==='chest'||it.s==='legs')return (it.t?T.n+' ':'')+A[it.s][lookIdx(it)];
  if(it.s==='pcollar')return (it.t?T.n+' ':'Leather ')+'Collar';
  if(it.s==='pharness')return (it.t?T.n+' ':'Leather ')+'Harness';
  if(it.s==='pcharm')return ({ruby:'Ruby',sapph:'Sapphire',emer:'Emerald',moon:'Moonstone'}[it.k]||'Lucky')+' Charm';
  return (it.t?T.n+' ':'')+A.cloak; }
const itemTitle=it=>`<b style="color:${RARITY[it.r].c}">${esc(itemName(it))}${it.lv?' +'+it.lv:''}</b>`;
function itemLines(it){ const p=ipow(it), b=BASE[it.s], L=[];
  if(isPetItem(it)){ const P=petItemStats(it); if(P.atk)L.push('+'+P.atk+' pet attack'); if(P.hp)L.push('+'+P.hp+' pet health'); if(P.crit)L.push('+'+P.crit+'% pet critical bites'); return L; }
  if(b.atk)L.push('+'+Math.round(b.atk*p*(1+((WEAPONS[it.k]||{}).b||0))+2)+' attack'); if(b.hp)L.push('+'+Math.round(b.hp*p+3)+' health'); if(b.def&&Math.round(b.def*p))L.push('+'+Math.round(b.def*p)+' defense');
  for(const k in it.a){ const A=ATTR[k]; L.push(A.n+' +'+attrVal(it,k)+(A.u||'')+(A.u?' '+A.d:'')); }
  return L; }
const eqItem=(h,s)=>h&&h.bag?h.bag.find(i=>i.i===h.eq[s])||null:null;
const BAGMAX=40;
const salvageValue=it=>Math.round((it.r+1)*(3+it.il/4)*(1+it.lv*.5));
const upCost=it=>({e:Math.ceil((it.lv+1)*(2+it.r)*(1+it.il/12)),g:Math.round((it.lv+1)*(10+it.il*6))});
const canUp=it=>it.lv<RARITY[it.r].max;
/* a fresh drop for this hero at level n. min = lowest rarity. */
function rollRarity(n,min){ const w=Math.floor(n/10), x=Math.random()*100, cut=[55-w*5,84-w*4,95.5-w*2,99.3-w*.5]; let r=0; while(r<4&&x>cut[r])r++; return Math.max(min||0,r); }
function dropItem(h,n,min){ if(ART.pets&&h.pet&&Math.random()<.15){ const sl=pick(PSLOTS), r=rollRarity(n,min); return mkItem(sl,sl==='pcharm'?pick(['ruby','sapph','emer','moon']):'',r,expLv(n)+Math.floor(rnd(-1,2)),sl==='pcharm'?0:(r<1?0:1+Math.floor(Math.random()*(TINTS.length-1)))); }
  const x=Math.random()*100, slot=x<30?'weapon':x<48?'head':x<68?'chest':x<86?'legs':'cloak', r=rollRarity(n,min), il=expLv(n)+Math.floor(rnd(-1,2));
  let kind='', t=0;
  if(slot==='weapon')kind=pick(Object.keys(WEAPONS).filter(k=>WEAPONS[k].c===h.cls&&(k!==STARTER[h.cls]||r<2)));
  else { const lk=slot==='cloak'?'':lookFor(r); kind=slot==='head'?CLASS_HEAD[h.cls]+(lk?'_'+lk:''):lk; t=r<1?Math.floor(rnd(0,2)):1+Math.floor(Math.random()*(TINTS.length-1)); }
  return mkItem(slot,kind,r,il,t); }
function gainItem(h,it){ markFound(h,it); if(h.bag.length>=BAGMAX){ const e=salvageValue(it); h.embers=(h.embers||0)+e; return {it,auto:e}; } h.bag.push(it); return {it}; }
function starterKit(h,il,wk,tint,head,cloak,wr){ il=il||1; h.bag=[]; h.eq={};
  const add=it=>{ h.bag.push(it); h.eq[it.s]=it.i; };
  add(mkItem('weapon',wk||STARTER[h.cls],wr||0,il)); add(mkItem('chest','',0,il,tint||0)); add(mkItem('legs','',0,il,tint||0));
  if(head)add(mkItem('head',CLASS_HEAD[h.cls],0,il,tint||0)); if(cloak)add(mkItem('cloak','',0,il,tint||0)); h.embers=h.embers||0; }
/* older saves (weapon/armor tiers 0-8 that levelled by themselves) become a matching kit, so nobody loses their look or strength */
function migrateGear(h){ if(h.bag)return;
  const look3=t=>t<1?0:t<4?1:2, wl=look3(h.weapon||0), al=look3(h.armor||0);
  const W={knight:['k_sword','k_shield','k_great'],wizard:['w_staff','w_tome','w_frost'],ranger:['r_bow','r_long','r_recurve'],barbarian:['b_hatchet','b_axe','b_twin'],paladin:['p_hammer','p_holy','p_dawn']}[h.cls];
  starterKit(h,1+(h.armor||0)*5,W[wl],[0,1,2][al],al>=1,al>=1,Math.min(3,Math.floor((h.weapon||0)/2)));

<script>
"use strict";
/* Hearthguard battle spell effects: a particle canvas over the battle stage. Fire trails embers and explodes, frost throws shards,
   lightning forks and flickers, meteors fall burning, arcane missiles curve in, drain pulls green life back to the caster.
   spellFx(kind, fromEl, toEl, col) resolves when the spell lands (so the hit lands on impact). */
const FX={cv:null,c:null,ps:[],bolts:[],raf:0,last:0};
function fxMount(){ const st=document.getElementById('bstage'); if(!st)return null; let cv=st.querySelector('canvas.fx');
  if(!cv){ cv=document.createElement('canvas'); cv.className='fx'; st.appendChild(cv); }
  const d=Math.min(1.5,window.devicePixelRatio||1), r=st.getBoundingClientRect(); cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
  FX.cv=cv; FX.c=cv.getContext('2d'); FX.d=d; FX.r=r; return cv; }
function fxPos(el,fy){ const r=el.getBoundingClientRect(), s=FX.r; return {x:(r.left-s.left+r.width/2)*FX.d,y:(r.top-s.top+r.height*(fy==null?.55:fy))*FX.d}; }
function fxAdd(p){ FX.ps.push(Object.assign({vx:0,vy:0,life:0,max:.6,size:6,col:'#fff',drag:.9,grav:0,glow:1,shape:'dot',rot:0,vr:0},p)); fxRun(); }
function fxRun(){ if(FX.raf)return; FX.last=performance.now(); const tick=now=>{ const dt=Math.min(.05,(now-FX.last)/1000); FX.last=now; fxDraw(dt);

    const k=1-p.life/p.max, sz=p.size*FX.d*(p.grow?1+p.life/p.max*p.grow:k*.7+.3); c.globalAlpha=Math.min(1,k*1.4)*(p.alpha||1);

    else { const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,sz*(p.glow?2.4:1)); g.addColorStop(0,p.core||'#fff'); g.addColorStop(.25,p.col); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.beginPath(); c.arc(p.x,p.y,sz*(p.glow?2.4:1),0,7); c.fill(); }
    return true; });
  FX.bolts=FX.bolts.filter(b=>{ b.life+=dt; if(b.life>=b.max)return false; if(Math.random()<.5)b.pts=fxZig(b.a,b.b,b.seg);

    for(const [w,col] of [[7*FX.d,b.col],[2.5*FX.d,'#fff']]){ c.lineWidth=w; c.strokeStyle=col; c.beginPath(); b.pts.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y)); c.stroke(); }

const rr=(a,b)=>a+Math.random()*(b-a);
function burst(at,cols,n,speed,size,max,extra){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=rr(.3,1)*speed*FX.d; fxAdd(Object.assign({x:at.x,y:at.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:cols[i%cols.length],size:rr(size*.5,size),max:rr(max*.6,max)},extra||{})); } }
/* travel from a to b over ms, calling trail(x,y) every frame; resolves at the end */
function fly(a,b,ms,trail,arc){ return new Promise(res=>{ let done=false; const fin=()=>{ if(!done){done=true;res()} }; setTimeout(fin,ms+250);   // never let an effect freeze a battle
    const t0=performance.now(), step=now=>{ if(done)return; const t=Math.min(1,(now-t0)/ms), e=t*t*(3-2*t)*.3+t*.7, h=arc?Math.sin(t*Math.PI)*arc:0;

async function spellFx(kind,fromEl,toEl,col){ if(!fxMount()||!fromEl||!toEl)return; const a=fxPos(fromEl,.45), b=fxPos(toEl,.55); col=col||'#ffffff'; const D=FX.d;

    burst(b,['#ffd040','#ff7a20','#ff3a10','#fff3c0'],46,520,10,.55,{drag:.86,grav:260*D}); fxAdd({x:b.x,y:b.y,col:'#ff8a30',core:'#fff8d0',size:34,max:.35,grow:1.5});
    for(let i=0;i<8;i++)fxAdd({x:b.x+rr(-20,20)*D,y:b.y,vx:rr(-30,30)*D,vy:rr(-80,-30)*D,col:'#5a4a40',size:rr(10,16),max:rr(.6,1),grow:1.5,glow:0,alpha:.35}); }
  else if(kind==='frost'){
    const n=7; await Promise.all(Array.from({length:n},(_,i)=>new Promise(res=>setTimeout(()=>fly(a,{x:b.x+rr(-30,30)*D,y:b.y+rr(-40,40)*D},260,(x,y)=>{ fxAdd({x,y,col:'#bfe8ff',size:6,max:.1,shape:'shard',rot:Math.atan2(b.y-a.y,b.x-a.x)}); if(Math.random()<.4)fxAdd({x,y,vx:rr(-20,20)*D,vy:rr(-20,20)*D,col:'#e8f8ff',size:2.5,max:.4}); }).then(res),i*35))));
    burst(b,['#ffffff','#bfe8ff','#7fc8ff'],34,380,7,.7,{shape:'shard',vr:6,drag:.88}); fxAdd({x:b.x,y:b.y,col:'#9fdcff',size:30,max:.4,grow:1.2}); }
  else if(kind==='lightning'){
    const bolt={a,b,seg:9,pts:fxZig(a,b,9),col:col==='#ffffff'?'#bfe4ff':col,life:0,max:.32}; bolt.br=[0,1].map(()=>{ const s=bolt.pts[3+Math.floor(Math.random()*4)]; return fxZig(s,{x:s.x+rr(-60,60)*D,y:s.y+rr(20,90)*D},4); });
    FX.bolts.push(bolt); fxRun(); await sleep(90); burst(b,['#ffffff','#bfe4ff','#7fb0ff'],30,600,5,.4,{drag:.82}); fxAdd({x:b.x,y:b.y,col:'#bfe4ff',size:26,max:.25,grow:1}); await sleep(80); }
  else if(kind==='starfall'){   // the wizard's power move: a shower of falling stars out of the sky onto the foe (owner: it must come from the sky)
    await Promise.all([0,1,2,3].map(i=>new Promise(res=>setTimeout(()=>{ const t={x:b.x+rr(-40,40)*D,y:b.y+rr(-25,25)*D}, s0={x:t.x-rr(40,110)*D,y:-80*D};
      fly(s0,t,360,(x,y)=>{ fxAdd({x,y,col:'#fff3a0',core:'#ffffff',size:18,max:.12}); for(let k=0;k<2;k++)fxAdd({x:x+rr(-8,8)*D,y:y+rr(-8,8)*D,vx:rr(-40,40)*D,vy:rr(-90,-20)*D,col:k?'#ffd040':'#bfe4ff',size:rr(3,7),max:rr(.3,.6)}); })
      .then(()=>{ burst(t,['#ffffff','#fff3a0','#ffd040','#bfe4ff'],34,560,9,.6,{drag:.86,grav:300*D}); fxAdd({x:t.x,y:t.y,col:'#fff3a0',core:'#ffffff',size:40,max:.35,grow:1.6}); res(); }); },i*140))));
    await sleep(60); }
  else if(kind==='meteor'){

      for(let i=0;i<4;i++)fxAdd({x:x+rr(-12,12)*D,y:y+rr(-12,12)*D,vx:rr(-80,20)*D,vy:rr(-120,-20)*D,col:i%2?'#ff4a10':'#ffd040',size:rr(4,9),max:rr(.3,.6)}); });

    for(let i=0;i<14;i++)fxAdd({x:b.x+rr(-50,50)*D,y:b.y+rr(-10,20)*D,vx:rr(-50,50)*D,vy:rr(-110,-40)*D,col:'#4a3a34',size:rr(14,24),max:rr(.8,1.3),grow:1.6,glow:0,alpha:.4}); }
  else if(kind==='arcane'){
    await new Promise(res=>{ const off=rr(-1,1); fly(a,b,320,(x,y,t)=>{ const w=Math.sin(t*Math.PI)*60*D*off; fxAdd({x:x,y:y+w,col:'#c08fff',core:'#ffffff',size:9,max:.18}); fxAdd({x:x,y:y+w,vx:rr(-30,30)*D,vy:rr(-30,30)*D,col:'#8a5aff',size:3,max:.45}); }).then(res); });

    for(let i=0;i<16;i++)setTimeout(()=>{ const st={x:b.x+rr(-20,20)*D,y:b.y+rr(-30,30)*D}; fly(st,a,380,(x,y)=>fxAdd({x,y,col:'#7dffb0',core:'#eafff2',size:5,max:.12}),rr(-40,40)*D); },i*28);

/* a short aura flash on the caster (power moves, heals, buffs) */
function auraFx(el,col){ if(!fxMount()||!el)return; const p=fxPos(el,.6), D=FX.d; for(let i=0;i<26;i++){ const a=i/26*6.283; fxAdd({x:p.x+Math.cos(a)*40*D,y:p.y+Math.sin(a)*14*D+20*D,vx:0,vy:rr(-160,-60)*D,col,size:rr(3,6),max:rr(.5,.9),drag:.95}); } fxAdd({x:p.x,y:p.y,col,size:40,max:.5,grow:1,alpha:.5}); }

<script>
"use strict";
/* Hearthguard atmosphere (2026-11-15): drifting particles per world, drawn over the exploring canvas in screen space, plus a soft vignette.
   woods: fireflies and drifting leaves · mines: dust motes and warm torch glow · marsh: rolling fog · frost: falling snow · spire: rising embers.
   The battle stage gets the same particles on its own canvas (ambMount). Cheap: at most ~70 particles. */
const AMB={woods:{n:34,kind:'firefly'},mines:{n:40,kind:'dust'},marsh:{n:14,kind:'fog'},frost:{n:70,kind:'snow'},spire:{n:46,kind:'ember'},camp:{n:30,kind:'ember'}};
function ambInit(theme,w,h){ const A=AMB[theme]||AMB.woods, ps=[]; for(let i=0;i<A.n;i++)ps.push(ambNew(A.kind,w,h,true)); return {kind:A.kind,ps,t:0}; }
/* weather particles (session 5): rain, snowstorm, falling ash. A second particle set on top of the world's own (levelWx in explore.js picks it). */
function ambInitK(kind,n,w,h){ const ps=[]; for(let i=0;i<n;i++)ps.push(ambNew(kind,w,h,true)); return {kind,ps,t:0}; }
let CURWX=null;   // the level's weather, so battles started there show it too
function ambNew(kind,w,h,anywhere){ const r=Math.random;
  if(kind==='rain')return {x:r()*w*1.2,y:anywhere?r()*h:-20,vx:-120-r()*40,vy:900+r()*400,s:14+r()*12,ph:r()*6};
  if(kind==='blizzard')return {x:anywhere?r()*w:w+10,y:r()*h,vx:-(260+r()*200),vy:60+r()*90,s:1.2+r()*2.8,ph:r()*6};
  if(kind==='ash')return {x:r()*w,y:anywhere?r()*h:-10,vx:-14+r()*10,vy:22+r()*26,s:1.4+r()*2.4,ph:r()*6,c:r()<.75?'#9a948e':'#ff8a3c'};
  if(kind==='snow')return {x:r()*w,y:anywhere?r()*h:-10,vx:-8-r()*14,vy:30+r()*50,s:1.2+r()*2.6,ph:r()*6};
  if(kind==='ember')return {x:r()*w,y:anywhere?r()*h:h+10,vx:-6+r()*12,vy:-(20+r()*40),s:1+r()*2.2,ph:r()*6,c:r()<.5?'#ff8a3c':'#c080ff'};
  if(kind==='fog')return {x:r()*w*1.4-w*.2,y:h*(.35+r()*.6),vx:6+r()*10,vy:0,s:h*(.12+r()*.16),ph:r()*6};
  if(kind==='dust')return {x:r()*w,y:r()*h,vx:-4+r()*8,vy:-3+r()*6,s:.8+r()*1.6,ph:r()*6};
  return {x:r()*w,y:h*(.2+r()*.75),vx:-10+r()*20,vy:-6+r()*12,s:1.6+r()*2,ph:r()*6};   // firefly
}
function ambDraw(c,A,w,h,dt,theme,noVig){ A.t+=dt; const d=Math.min(2,window.devicePixelRatio||1);
  c.save();
  if(theme==='mines'&&!noVig){ const g=c.createRadialGradient(w*.5,h*.55,h*.1,w*.5,h*.55,h*.9); g.addColorStop(0,'rgba(255,170,80,.10)'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,w,h); }
  for(const p of A.ps){ p.x+=p.vx*dt*d; p.y+=p.vy*dt*d; p.ph+=dt;
    if(A.kind==='rain'){ if(p.y>h+20)Object.assign(p,ambNew('rain',w,h)); c.globalAlpha=.42; c.strokeStyle='#cfe0ee'; c.lineWidth=1.3*d; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*.018*d,p.y-p.s*d); c.stroke();
      if(Math.random()<.004){ c.globalAlpha=.3; c.beginPath(); c.ellipse(p.x,h*(.55+Math.random()*.4),6*d,2*d,0,0,7); c.stroke(); } continue; }
    if(A.kind==='blizzard'){ p.y+=Math.sin(p.ph*2)*.8*d; if(p.x<-20||p.y>h+10)Object.assign(p,ambNew('blizzard',w,h)); c.globalAlpha=.8; c.fillStyle='#fff'; c.beginPath(); c.arc(p.x,p.y,p.s*d,0,7); c.fill(); continue; }
    if(A.kind==='ash'){ p.x+=Math.sin(p.ph*1.1)*.6*d; if(p.y>h+10)Object.assign(p,ambNew('ash',w,h)); c.globalAlpha=p.c==='#ff8a3c'?.5+.4*Math.sin(p.ph*4):.55; c.fillStyle=p.c; c.save(); c.translate(p.x,p.y); c.rotate(p.ph); c.fillRect(-p.s*d,-p.s*.5*d,p.s*2*d,p.s*d); c.restore(); continue; }
    if(A.kind==='snow'){ p.x+=Math.sin(p.ph*1.3)*.4*d; if(p.y>h+10||p.x<-20)Object.assign(p,ambNew('snow',w,h)); c.globalAlpha=.85; c.fillStyle='#fff'; c.beginPath(); c.arc(p.x,p.y,p.s*d,0,7); c.fill(); }
    else if(A.kind==='ember'){ p.x+=Math.sin(p.ph*2)*.5*d; if(p.y<-10)Object.assign(p,ambNew('ember',w,h)); c.globalAlpha=.55+.45*Math.sin(p.ph*5); c.fillStyle=p.c; const a0=c.globalAlpha; c.globalAlpha=a0*.25; c.beginPath(); c.arc(p.x,p.y,p.s*d*3,0,7); c.fill(); c.globalAlpha=a0; c.beginPath(); c.arc(p.x,p.y,p.s*d,0,7); c.fill(); }

  let atk=(6+2.2*h.lvl+g.atk)*c.atk*(1+.04*tal(h,'str')); if(r.includes(1))atk*=1.1; if(r.includes(4))atk*=1.15;
  return {hp:Math.round(hp),atk:Math.round(atk),def:g.def,crit:c.crit+g.crit/100+(r.includes(4)?.1:0)+.02*tal(h,'keen'),luck:g.luck/100,focus:g.focus/100+.08*tal(h,'focus'),leech:g.leech/100+(h.cls==='barbarian'&&tal(h,'cap')?.1:0)};}

  starterKit(h,1); h.hp=stats(h).hp; return h;}

const potionPrice=()=>12+4*H.lvl;
const raidLeft=()=>H.raidDay===today()?Math.max(0,3-(H.raidTries||0)):3;
function raidHp(){let d=0; for(const id in heroes){const h=id===me&&H?H:heroes[id]; if(h&&h.raidNo===world.no)d+=h.raidDmg||0} return Math.max(0,raidMax(world.no)-d)}
/* Looks: every 12 hero levels is a rank (aura + a little bigger). */
const RANKS=['Recruit','Adventurer','Veteran','Champion','Hero','Paragon','Legend','Mythic','Ascendant'], RANK_COL=['','#c98a4a','#d8dde6','#f2c35b','#ff7a3c','#b070ff','#aef0ff','#7fffd0','#ffffff'];

  if(ups){H.hp=stats(H).hp; if(H.lvl%5===0)feat('reached level '+H.lvl)} return ups; }

/* ---------- save / sync ---------- */
let saving=false,dirty=false;

const mine=()=>(lsGet('hg_mine')||[]).filter(id=>!gone.has(id));
function remember(id){ const m=mine().filter(x=>x!==id); m.unshift(id); lsSet('hg_mine',m); }
function allHeroes(){ const out={}; for(const id of mine()){ const h=fixHero(lsGet('hg_hero_'+id)); if(h)out[id]=h; } for(const id in heroes)if(!gone.has(id)&&(!out[id]||(heroes[id].rev||0)>=(out[id].rev||0)))out[id]=heroes[id]; if(me&&H&&!gone.has(me))out[me]=H; return out; }
/* saves from before heroes had their own ids (one per family member) join this device's list */
{ const m=lsGet('hg_mine')||[]; ['dad','lauren','jeremiah','jude',lsGet('hg_me')].forEach(id=>{ if(id&&!m.includes(id)&&lsGet('hg_hero_'+id))m.push(id) }); lsSet('hg_mine',m); }
function forget(id){ gone.add(id); lsSet('hg_gone',[...gone]); delete heroes[id]; lsSet('hg_hero_'+id,null); lsSet('hg_mine',mine()); if(me===id){ me=null; H=null; lsSet('hg_me',null); } }
function save(){ if(!H||!me)return; H.rev=(H.rev||0)+1; H.t=Date.now(); lsSet('hg_hero_'+me,H); heroes[me]=clone(H); if(!db||!loaded)return; dirty=true; pump(); }
async function pump(){ if(saving||!db)return; saving=true;
  while(dirty&&db){ dirty=false; const slot=me, body=clone(H), d=db;
    try{await d.doc('heroes/'+slot).set(body)}catch(e){ await sleep(1500); try{await d.doc('heroes/'+slot).set(body)}catch(e2){ if(e2&&e2.code==='gone'){ forget(slot); if(!busy()){S.screen='who';render()} toast('That hero was retired on another device.'); break; } if(!busy())toast('Could not reach the guild hall. Progress is saved on this device.'); } } }
  saving=false; }
function setWorld(no){ world={no}; lsSet('hg_world',world); if(db&&loaded) db.doc('world/raid').set({no,t:Date.now()}).catch(()=>{}); }
function adoptMine(){ if(!me||busy())return; const d=heroes[me]; if(d&&(!H||(d.rev||0)>(H.rev||0))){H=fixHero(clone(d));lsSet('hg_hero_'+me,H)} else if(H&&(!d||(d.rev||0)<(H.rev||0))){dirty=true;pump()} }
function softRender(){ if(busy())return; const a=document.activeElement; if(a&&a.tagName==='INPUT')return; if(['who','camp','guild'].includes(S.screen))render(); }
function checkRaid(){ if(!H||busy())return;
  if(world.no>(H.raidNo||1)){ const did=(H.raidDmg||0)>0, prev=world.no-1;
    if(did){ const g=60*prev+30*H.lvl, xp=Math.round(need(H.lvl)*.5); H.gold+=g; H.scales=(H.scales||0)+1; addXp(xp); feat('helped bring down Ashmaw');
      toast('Ashmaw is defeated! Your share: '+g+' gold, '+xp+' XP and a Titan Shard.'); sfx.win(); }
    H.raidNo=world.no; H.raidDmg=0; save(); }
  else if(raidHp()<=0 && Object.keys(heroes).length){ setWorld(world.no+1); checkRaid(); } }
function processGifts(){ if(!H||busy()||!db)return; let got=false;
  for(const g of giftDocs){ if(g.to!==me||seenGifts.has(g.id))continue; seenGifts.add(g.id); got=true;
    if(g.kind==='potion'){H.potions++; toast(g.from+' sent you a potion!')} else if(g.kind==='help'){H.gold+=40; H.embers=(H.embers||0)+3; toast('You fought beside '+g.from+'! Your share: 40 gold and 3 embers.')} else {H.gold+=25; toast(g.from+' sent you 25 gold!')}
    db.doc('gifts/'+g.id).delete().catch(()=>{}); }

/* Home-screen (GitHub Pages) build: window.HG_CLOUD is the save server. This shim gives it the same shape as the claude.ai db. */
const canonPw=v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
async function sha256hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function cloudDb(url,key){
  const subs={heroes:[],world:[],gifts:[]}; let chain=Promise.resolve(), last='', dead=false;
  const emit=st=>{ const sig=JSON.stringify([st.heroes,st.world,st.gifts,st.gone]); if(sig===last)return; last=sig;
    (st.gone||[]).forEach(id=>{ if(!gone.has(id))forget(id) });
    subs.heroes.forEach(f=>f({docs:Object.keys(st.heroes).map(id=>({id,data:()=>st.heroes[id]})),metadata:{fromCache:false}}));
    subs.world.forEach(f=>f({exists:true,data:()=>st.world})); subs.gifts.forEach(f=>f({docs:st.gifts.map(g=>({id:g.id,data:()=>g}))})); };
  const call=body=>{ const p=chain.then(async()=>{ if(dead)throw {code:'key'};
      const r=await fetch(url+'/hg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({key},body))});
      if(r.status===403){ dead=true; clearInterval(tick); lsSet('hg_key',null); try{document.cookie='hg-key=; max-age=0; path='+location.pathname}catch(e){} db=null;
        S.lockMsg='That password did not work. Try again.'; B=null; if(window.stopExplore)stopExplore(); S.screen='lock'; render(); throw {code:'key'} }
      const j=await r.json(); if(!j.ok)throw {code:j.error}; emit(j); return j; });
    chain=p.catch(()=>{}); return p; };
  const poll=()=>{ if(!dead&&document.visibilityState==='visible')call({op:'get'}).catch(()=>{}) };
  const tick=setInterval(poll,20000); document.addEventListener('visibilitychange',poll); poll();
  return { doc(path){ const p=path.split('/'); return {
      set:b=>p[0]==='heroes'?call({op:'hero',slot:p[1],body:b}):call({op:'world',no:b.no}),
      delete:()=>p[0]==='heroes'?call({op:'unhero',slot:p[1]}):call({op:'ungift',id:p[1]}), onSnapshot:f=>{subs.world.push(f)} } },
    collection(c){ return { onSnapshot:f=>{subs[c].push(f)}, add:b=>call({op:'gift',to:b.to,from:b.from,kind:b.kind}) } } };
}
let connTimer=null;
function connDone(){ if(loaded)return; loaded=true; adoptMine(); checkRaid(); if(!busy())render(); }
function goOffline(){ clearTimeout(connTimer); offline=true; connDone(); }
function wire(d){ db=d;
  d.collection('heroes').onSnapshot(snap=>{ const nh={}; snap.docs.forEach(x=>{const v=fixHero(clone(x.data()||{})); if(v&&!gone.has(x.id))nh[x.id]=v}); heroes=nh;
    if(!snap.metadata.fromCache||loaded){clearTimeout(connTimer);offline=false; if(!loaded){connDone()} else {adoptMine();checkRaid();softRender()} } }, goOffline);
  d.doc('world/raid').onSnapshot(s=>{ if(s.exists){const v=s.data(); if(v&&v.no>world.no){world={no:v.no};lsSet('hg_world',world)} } if(loaded){checkRaid();softRender()} },()=>{});
  d.collection('gifts').onSnapshot(s=>{ giftDocs=s.docs.map(x=>Object.assign({id:x.id},x.data())); if(loaded)processGifts(); },()=>{});
}
function connect(){
  clearTimeout(connTimer); connTimer=setTimeout(()=>{ if(!loaded){offline=true;connDone()} },10000);
  if(window.HG_CLOUD){ const k=lsGet('hg_key'); if(!k){clearTimeout(connTimer); S.screen='lock'; render(); return} wire(cloudDb(window.HG_CLOUD,k)); return; }
  if(!window.claude||!window.claude.use){goOffline();return}
  window.claude.use('db').then(d=>{ if(!d){goOffline();return} wire(d); }).catch(goOffline);
}
/* Invites (home-screen build). A QR/link carries #key=<saved key> (or #join=<password>). A home-screen app has its own storage on iPhones,
   so the invite travels with Add to Home Screen: in the link the icon starts on, and in a cookie. */
function keepInvite(k){
  const base=location.origin+location.pathname, join=base+'#key='+k;
  try{document.cookie='hg-key='+k+'; path='+location.pathname+'; max-age=31536000; SameSite=Lax; Secure'}catch(e){}
  if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)return;
  document.querySelectorAll('link[rel=manifest]').forEach(l=>l.remove());
  const man={name:'Hearthguard',short_name:'Hearthguard',start_url:join,scope:base,display:'standalone',orientation:'landscape',background_color:'#14171b',theme_color:'#14171b',
    icons:[{src:base+'icon-180.png',sizes:'180x180',type:'image/png'},{src:base+'icon-512.png',sizes:'512x512',type:'image/png'}]};
  const l=document.createElement('link'); l.rel='manifest'; l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
  if(lsGet('hg_tip_off'))return;
  const tip=document.createElement('div'); tip.setAttribute('role','status'); tip.className='tip';
  tip.textContent='Make it an app: tap Share, then Add to Home Screen, and always play from that icon.';
  const x=document.createElement('button'); x.textContent='✕'; x.setAttribute('aria-label','Close'); x.className='tipx';
  x.addEventListener('click',()=>{tip.remove();lsSet('hg_tip_off',1)}); tip.appendChild(x); document.body.appendChild(tip);
}
function boot(){ render(); connect(); const k=lsGet('hg_key'); if(window.HG_CLOUD&&k)keepInvite(k); }
function start(){
  if(window.HG_CLOUD){
    let m=/[#&]key=([0-9a-f]{64})/.exec(location.hash), j=/[#&]join=([^&]+)/.exec(location.hash), c=null;
    try{c=/(?:^|; )hg-key=([0-9a-f]{64})/.exec(document.cookie)}catch(e){}
    if(m){lsSet('hg_key',m[1]);boot()}
    else if(j){render(); sha256hex(canonPw(decodeURIComponent(j[1]))).then(k=>{lsSet('hg_key',k);boot()})}
    else { if(!lsGet('hg_key')&&c)lsSet('hg_key',c[1]); boot(); }
  } else boot();
}

/* ----- daily quests (session 5, idea 2): three small goals a day per hero, new ones each morning, rewards scale with level ----- */
const QUESTS={kill:{t:n=>`Defeat ${n} monsters`,n:[8,14]}, win:{t:n=>`Win ${n} battles`,n:[4,7]}, chest:{t:n=>`Open ${n} chests`,n:[2,4]},
  level:{t:n=>n>1?`Finish ${n} levels`:'Finish a level',n:[1,2]}, pow:{t:n=>`Unleash your power move ${n} times`,n:[2,3]},
  elite:{t:()=>'Defeat an elite foe or a boss',n:[1,1]}, forge:{t:()=>'Upgrade a piece of gear at the Forge',n:[1,1]}};
function strHash(t){ let h=7; for(const ch of t)h=(h*31+ch.charCodeAt(0))%2147483647; return h||1; }
function dailyQuests(){ const d=today(); if(!H.dq||H.dq.day!==d){ let s=strHash(d+'|'+(me||H.name)); const rnd=()=>(s=s*16807%2147483647)/2147483647;
    const keys=Object.keys(QUESTS), q=[]; while(q.length<3){ const k=keys[Math.floor(rnd()*keys.length)]; if(q.some(x=>x.k===k))continue; const r=QUESTS[k].n; q.push({k,need:r[0]+Math.floor(rnd()*(r[1]-r[0]+1)),have:0,claimed:0}); }
    H.dq={day:d,q}; } return H.dq; }
const questText=q=>QUESTS[q.k]?QUESTS[q.k].t(q.need):'';
const questReward=()=>({gold:25+H.lvl*8,embers:3+Math.floor(H.lvl/4)});
function questTick(k,amt){ if(!H)return; const dq=dailyQuests(); for(const q of dq.q)if(q.k===k&&q.have<q.need){ q.have=Math.min(q.need,q.have+(amt||1)); if(q.have>=q.need)setTimeout(()=>toast('Daily quest done: '+questText(q)+'. Claim it at camp.'),900); } }

/* ----- family co-op (session 5, idea 1): call another family hero to fight beside you. They join every battle as a computer-controlled
   ally (their own look, gear and strength), walk behind you on the map, and get a share (40 gold + 3 embers) when you finish a level together. ----- */
function allyHero(){ const id=lsGet('hg_ally_'+me); if(!id||id===me||gone.has(id))return null; const h=allHeroes()[id]; return h&&h.cls?h:null; }
const allyId=()=>{ const id=lsGet('hg_ally_'+me); return allyHero()?id:null; };

  if(!B.allyHeal&&H.hp>0&&H.hp<st.hp*.4){ B.allyHeal=1; const h=Math.round(st.hp*.25); H.hp=Math.min(st.hp,H.hp+h); bpop('bh','+'+h,'heal'); if(sfx.heal)sfx.heal(); blog(A.name+' throws you a healing draught: +'+h+' health!'); battleUI(); await sleep(500); return; }

    bpop(fid(t),'-'+d,cr?'crit':''); bShake(fid(t),MF.hit,MN); cr?sfx.crit():sfx.hit(); blog(A.name+(cr?' lands a critical hit on ':' strikes ')+t.n+' for '+d+'.'); battleUI(); },A.cls==='ranger'?'arrow':'orb',HF.atk,null);
  await sleep(150); }
/* bosses transform at half health (session 4): a scene, a new look (glow in the world's colour, bigger, pulsing), harder hits and a second strike sometimes */
const ENRAGE=[{c:'#ff3020',s:'Its eyes burn red!'},{c:'#ff7a20',s:'Molten cracks split its body!'},{c:'#7fffb0',s:'The bog rises around it!'},{c:'#9fe0ff',s:'Its armour cracks and ice spikes burst out!'},{c:'#c070ff',s:'Dark power pours out of it!'}];
async function enrage(e){ e.phase2=1; e.atk*=1.3; const id=fid(e), el=$b(id), st=$b('bstage'), E=ENRAGE[e.scene]||ENRAGE[0]; B.anim=true;
  if(st){ const o=document.createElement('div'); o.className='bossintro'; o.innerHTML=`<div class="bi-name" style="color:${E.c}">${esc(e.n)} transforms!</div><div class="bi-sub">${E.s}</div>`; st.appendChild(o);
    if(sfx.power)sfx.power(); await sleep(1300); o.classList.add('out'); setTimeout(()=>o.remove(),400); }

async function enemyTurn(){ const st=stats(H);
  for(const e of B.es)if(e.kind==='boss'&&e.hp>0&&!e.phase2&&e.hp<=e.max/2){ await enrage(e); if(!B)return; }
  for(const e of B.es){ if(!B||B.result)return; if(e.hp<=0)continue; const id=fid(e);
    if(e.poison>0){ const was=e.hp; e.hp=Math.max(0,e.hp-e.pdmg); if(B.raid)B.dealt+=was-e.hp; e.poison--; blog('Poison burns '+e.n+' for '+e.pdmg+'.'); bpop(id,'-'+e.pdmg); bShake(id,MF.hit,MN); battleUI(); await sleep(450); if(!B)return;
      if(e.hp<=0){ reap(); if(!alive().length)return finishBattle(true); continue; } }
    if(e.stun>0){ e.stun--; if(e.charge){ e.charge=false; blog(e.n+' is stunned and its mighty blow is broken!'); } else blog(e.n+' is stunned and cannot move!'); battleUI(); await sleep(500); continue; }
    if(e.role==='healer'){ e.hcd=(e.hcd||0)-1; const hurt=B.es.filter(f=>f.hp>0&&f.hp<f.max*.65).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];   // smarter enemies (session 5)
      if(hurt&&e.hcd<=0){ e.hcd=3; const amt=Math.round(hurt.max*.18); hurt.hp=Math.min(hurt.max,hurt.hp+amt); const he=$b(fid(hurt)); if(he)auraFx(he,'#7dffb0'); bpop(fid(hurt),'+'+amt,'heal'); if(sfx.heal)sfx.heal();
        blog(e.n+' heals '+(hurt===e?'itself':hurt.n)+' for '+amt+'!'); battleUI(); await sleep(700); e.et++; continue; } }
    let d=e.atk*rnd(.85,1.15); if(e.weak>0){d*=.7;e.weak--} const heavy=e.charge; if(heavy){d*=1.8;e.charge=false}
    const crit=!heavy&&Math.random()<.08; if(crit)d*=1.6;
    d*=1-.03*tal(H,'skin')-(H.cls==='knight'&&tal(H,'cap')?.1:0); d=Math.max(1,Math.round(d-st.def)); if(B.guard>0)d=Math.ceil(d/2);
    const sp=foeSpell(e.id), caster=!!sp;
    if(petUp()&&Math.random()<.3){   // sometimes the monster goes for your pet
      const ps=petStats(H); let pd=Math.max(1,Math.round(e.atk*rnd(.85,1.15)*(e.weak>0?.7:1)*.85));
      await attackAnim(id,['bp'],caster,sp?sp[1]:'#ff6a5a',()=>{ H.pet.hp=Math.max(0,H.pet.hp-pd); bpop('bp','-'+pd); bShake('bp',MF.hit,petN(H.pet.k)); sfx.hurt(); blog(e.n+' attacks '+H.pet.name+' for '+pd+'.');
        if(H.pet.hp<=0){ blog(H.pet.name+' is knocked out! Heal it with a Pet Treat or at the fire.'); const pe=$b('bp'); if(pe)pe.classList.add('gone'); } battleUI(); },'orb',null,sp?sp[0]:null);
      if(!B)return; e.et++; await sleep(120); continue; }
    await attackAnim(id,['bh'],caster,sp?sp[1]:'#ff6a5a',()=>{ H.hp=Math.max(0,H.hp-d); H.pow=Math.min(100,(H.pow||0)+Math.round(6*(1+st.focus)));
      bpop('bh','-'+d,heavy||crit?'crit':''); bShake('bh',HF.hit,HN); sfx.hurt(); blog(e.n+(heavy?' unleashes a mighty blow for ':crit?' lands a critical hit for ':' hits you for ')+d+'.'); battleUI(); },'orb',null,sp?sp[0]:null);
    if(!B)return;
    if(e.phase2&&H.hp>0&&Math.random()<.35){ const d2=Math.max(1,Math.round(d*.6)); await sleep(150);   // a transformed boss sometimes strikes twice
      await attackAnim(id,['bh'],caster,sp?sp[1]:'#ff6a5a',()=>{ H.hp=Math.max(0,H.hp-d2); bpop('bh','-'+d2); bShake('bh',HF.hit,HN); sfx.hurt(); blog(e.n+' strikes again for '+d2+'!'); battleUI(); },'orb',null,sp?sp[0]:null); if(!B)return; }
    e.et++; if(H.hp<=0)break;
    if(e.big||B.raid?e.et%3===2:e.et%4===3){ e.charge=true; blog(e.n+' is gathering power for a mighty blow! Stun it or raise your guard.'); battleUI(); }
    await sleep(120); }

  if(B.raid){B.turns--; if(B.turns<=0)return finishBattle(false,true)} }
function finishBattle(win,flew){ const st=stats(H), es=B.es; B.anim=true;

  if(B.raid){ const dealt=B.dealt; if(H.raidDay!==today()){H.raidDay=today();H.raidTries=0} H.raidTries++; if((H.raidNo||1)!==world.no){H.raidNo=world.no;H.raidDmg=0}
    H.raidDmg=(H.raidDmg||0)+dealt; H.hp=st.hp; if(dealt>0)feat('struck Ashmaw for '+dealt); save();

  if(win&&!B.raid){ H.book=H.book||{}; const nw=[]; for(const e of es){ if(!H.book[e.id])nw.push(e.n.replace(/^Shield | Healer$/g,'')); H.book[e.id]=(H.book[e.id]||0)+1; }
    if(nw.length){ H.embers=(H.embers||0)+2*nw.length; setTimeout(()=>toast('New in your Collection Book: '+nw.join(', ')+'! +'+2*nw.length+' embers'),700); } }
  if(win){ const gold=es.reduce((a,e)=>a+e.gold,0), xp=es.reduce((a,e)=>a+e.xp,0), n=es[0].lv||0;
    const g=Math.round(gold*rnd(.85,1.15)*((H.relics||[]).includes(0)?1.2:1)*(1+st.luck)); H.gold+=g; H.kills=(H.kills||0)+es.length; res.gold=g; res.xp=xp; questTick('kill',es.length); questTick('win'); if(es.some(e=>e.elite||e.kind==='boss'||e.kind==='mini'))questTick('elite');
    const r0=rank(H); res.ups=addXp(xp); if(rank(H)>r0)res.rank=rank(H);
    /* embers (the forge currency) and found gear */
    const w=Math.floor(n/10); let emb=0; res.loot=[];
    for(const e of es){ emb+=e.kind==='boss'?25+w*10:e.kind==='mini'?12+w*5:1+Math.floor(Math.random()*(2+w));
      if(e.id==='mimic')res.loot.push(gainItem(H,dropItem(H,n,1)));
      else if(e.kind==='boss'){ res.loot.push(gainItem(H,dropItem(H,n,2))); res.loot.push(gainItem(H,dropItem(H,n,3))); }
      else if(e.kind==='mini')res.loot.push(gainItem(H,dropItem(H,n,2)));
      else if(e.elite)res.loot.push(gainItem(H,dropItem(H,n,2)));
      else if(Math.random()<.08)res.loot.push(gainItem(H,dropItem(H,n))); }
    H.embers=(H.embers||0)+emb; res.embers=emb;
    if(H.relics.includes(2)&&!res.ups)H.hp=Math.min(stats(H).hp,H.hp+Math.round(stats(H).hp*.15));
    sfx.win(); }
  else { H.hp=st.hp; if(H.pet)H.pet.hp=petStats(H).hp; res.lost=Math.floor(H.gold*.15); H.gold-=res.lost; sfx.lose(); }
  save(); B.result=res; battleUI(); if(res.ups)levelUpFx(res.rank); }
/* level-up moment (session 4): a gold beam comes down on the hero, sparkles rise, LEVEL UP! (and the new rank's colour when you rank up) */
function levelUpFx(newRank){ const st=$b('bstage'), hb=$b('bh'); if(!st||!hb)return; const col=newRank?RANK_COL[newRank]:'#ffd870';
  const a=hb.getBoundingClientRect(), s=st.getBoundingClientRect(), beam=document.createElement('div'); beam.className='lvbeam';
  beam.style.left=(a.left-s.left+a.width/2)+'px'; beam.style.setProperty('--c',col); st.appendChild(beam); setTimeout(()=>beam.remove(),1800);
  const t=document.createElement('div'); t.className='shout'; t.textContent=newRank?RANKS[newRank]+'!':'Level up!'; t.style.color=col; st.appendChild(t); setTimeout(()=>t.remove(),1300);
  auraFx(hb,col); setTimeout(()=>auraFx(hb,'#ffffff'),350); setTimeout(()=>auraFx(hb,col),700); if(sfx.power)sfx.power(); }
